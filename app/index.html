<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rail</title>
    <!-- Theme, density and language before the first paint (R2.8, src/lib/appearance.ts). -->
    <script src="/appearance.js"></script>
    <link rel="preload" href="/fonts/inter-v4.1-latin.woff2" as="font" type="font/woff2" crossorigin="" />
    <!--
      The boot loader: what the window shows between being shown (lib.rs shows
      it at the end of setup, often before the bundle has run) and React's
      first render, instead of a blank frame. The same Rail mark and animation
      as @rail/ui's RailLoader at its page size, drawn here with inline CSS and
      SVG because nothing else has loaded yet (the CSP allows inline styles,
      not inline scripts; no request leaves the page). Its colours are the
      tokens' (surface-base, text-tertiary, accent-fg) for the theme
      appearance.js has just set on <html>. It sits inside #root, so React's
      first render replaces it; invisible for its first 150 ms like the
      loader, so a fast start does not flash it.
    -->
    <style>
      .rail-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0f14;
        color: #8395aa;
      }
      .rail-boot svg {
        display: block;
        overflow: visible;
        animation: rail-boot-appear 220ms cubic-bezier(0.2, 0.9, 0.3, 1) 150ms both;
      }
      .rail-boot .track {
        opacity: 0.3;
      }
      .rail-boot .light {
        stroke: #3ea6ff;
      }
      .rail-boot .board {
        fill: #3ea6ff;
        transform-box: fill-box;
        transform-origin: center;
      }
      html[data-theme="light"] .rail-boot {
        background: #f6f8fb;
        color: #5b6b80;
      }
      html[data-theme="light"] .rail-boot .light {
        stroke: #0e6cbe;
      }
      html[data-theme="light"] .rail-boot .board {
        fill: #0e6cbe;
      }
      @media (prefers-reduced-motion: no-preference) {
        .rail-boot .light {
          animation: rail-boot-run 1.1s linear infinite;
        }
        .rail-boot .board {
          animation: rail-boot-breathe 1.1s cubic-bezier(0.2, 0, 0, 1) infinite alternate;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .rail-boot svg {
          animation:
            rail-boot-appear 220ms ease-out 150ms both,
            rail-boot-fade 1.6s cubic-bezier(0.2, 0, 0, 1) 370ms infinite alternate;
        }
      }
      @keyframes rail-boot-appear {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes rail-boot-run {
        from {
          stroke-dashoffset: 0;
        }
        to {
          stroke-dashoffset: -68.65px;
        }
      }
      @keyframes rail-boot-breathe {
        from {
          opacity: 1;
          transform: scaleX(1);
        }
        to {
          opacity: 0.45;
          transform: scaleX(0.7);
        }
      }
      @keyframes rail-boot-fade {
        from {
          opacity: 1;
        }
        to {
          opacity: 0.45;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="rail-boot" role="status" aria-label="Rail">
        <svg viewBox="0 0 32 32" width="64" height="64" fill="none" stroke-width="3" aria-hidden="true" focusable="false">
          <ellipse class="track" cx="16" cy="16" rx="13.5" ry="8" stroke="currentColor" />
          <ellipse class="light" cx="16" cy="16" rx="13.5" ry="8" stroke-linecap="round" stroke-dasharray="19.22 49.43" />
          <rect class="board" x="11.5" y="14.5" width="9" height="3" rx="1.5" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
