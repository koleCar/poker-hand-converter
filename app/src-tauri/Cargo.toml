[package]
name = "rail-app"
description = "Rail desktop app: the Tauri 2 shell around the core (docs/RAIL-PLAN.md R1.1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
# Native only: macOS and Windows ship, Linux is checked in CI. Never built for
# wasm32 (the core's WebAssembly build names its packages with `-p`).

[lib]
name = "rail_app"
path = "src/lib.rs"

[[bin]]
name = "rail"
path = "src/main.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
# Held on the 2.11 line with `tauri`; see below.
tauri-codegen = "=2.6.3"
tauri-plugin = "=2.6.3"

# Tauri and its plugins are pinned exactly (R1.1): the CLI in app/package.json
# (`@tauri-apps/cli`) and `@tauri-apps/api` must stay on the same minor as
# `tauri`, and `tauri build` refuses a mismatch. Bump them together.
[dependencies]
rail-core = { path = "../../core/rail-core" }
rail-config = { path = "../../core/rail-config" }
rail-store = { path = "../../core/rail-store" }
# The displayed statistics (R2.4 definitions, R2.5 reliability) of the
# Today and Reports screens (R2.7b).
rail-stats = { path = "../../core/rail-stats" }
rail-watch = { path = "../../core/rail-watch" }
# The desktop account (R1.7): the handoff, GoTrue, the refresh loop.
rail-sync = { path = "../../core/rail-sync" }
# The HUD process (R3.2): its supervisor and the channel to it.
rail-hud-ipc = { path = "../../hud/rail-hud-ipc" }
# (R3.9) The HUD editor: the design model, presets, room checks and the
# renderer's scene for the preview - the HUD's own code, so the preview is
# what a table shows.
rail-hud = { path = "../../hud/rail-hud" }
# (R3.9) A new design's random id. The version rail-sync locks.
ring = "=0.17.14"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-log = "=2.9.1"
# The first-run screen's "Add a folder manually..." folder picker (R1.4,
# `folders.rs`) and the debug-only "convert a file" panel (`dev.rs`); called
# from Rust, not exposed to the window.
tauri-plugin-dialog = "=2.7.3"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# `deep-link`: a `rail://` link that starts a second process (Windows, Linux)
# is forwarded to the running one and arrives as a deep-link event (R1.7).
tauri-plugin-single-instance = { version = "=2.4.4", features = ["deep-link"] }
# `rail://` links (R1.7, the sign-in callback). 2.4.10 is the last release
# for tauri 2.10/2.11; 2.5 and later need tauri 2.12. Called from Rust only;
# no plugin permission for the window.
tauri-plugin-deep-link = "=2.4.10"
# The session's refresh token in the OS keychain (R1.7): macOS Keychain,
# Windows Credential Manager. Linux (not shipped) gets keyring's in-memory
# store, so a Linux build signs in for one run only.
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native"] }
# Opens the sign-in page in the default browser (R1.7).
open = "=5.3.3"
url = "=2.5.8"
tauri-plugin-autostart = "=2.5.1"
# `tauri` 2.11.5 asks for its own sub-crates with caret requirements, so a
# fresh resolve pulls the 2.12 line of these, which does not compile against
# tauri 2.11 (`Error::UnexpectedMenuKind` and friends). They are listed only
# to hold them on the versions tauri 2.11.5 was released with; nothing here
# uses them directly. Move them with `tauri`, all at once.
tauri-runtime = "=2.11.3"
tauri-runtime-wry = "=2.11.4"
tauri-utils = "=2.9.3"
tauri-macros = "=2.6.3"

[dev-dependencies]
# (R3.8) Tauri's mock runtime (`tauri::test`): the HUD popup's window is
# opened, moved and closed in `cargo test` without a display. The feature
# adds no crate (`test = []`); the version is `tauri`'s above.
tauri = { version = "=2.11.5", features = ["tray-icon", "test"] }
