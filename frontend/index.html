<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0b0f14" />

    <title>PokerConverter — poker hand replayer &amp; hand history converter</title>
    <meta
      name="description"
      content="Replay any poker hand action by action and share it with one link. Convert hand histories from any poker room to the standard Holdem Manager format. Free, no account."
    />

    <!--
      Static defaults. Per-route tags are set client-side by
      src/routes/useDocumentMeta.ts; link-unfurl crawlers hitting /h/:slug are
      rewritten to /api/share-meta (see vercel.json), which serves per-hand tags.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PokerConverter" />
    <meta property="og:title" content="PokerConverter — poker hand replayer &amp; hand history converter" />
    <meta
      property="og:description"
      content="Replay any poker hand action by action and share it with one link. Free, in the browser."
    />
    <meta property="og:image" content="/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PokerConverter — poker hand replayer" />
    <meta
      name="twitter:description"
      content="Replay any poker hand action by action and share it with one link. Free, in the browser."
    />
    <meta name="twitter:image" content="/og-default.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
