<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0b0f14" />

    <!--
      Inter, self-hosted. Not Google Fonts: browsers partitioned the HTTP cache
      by top-level site in 2020, so the shared-cache argument for a font CDN is
      dead — every visitor downloads it fresh for this origin regardless. What
      is left is two extra DNS + TLS handshakes in front of the first painted
      glyph, and a German line of cases (LG München I 3 O 17493/20 onwards)
      holding that hotlinking it hands the visitor's IP to Google without
      consent. One request from our own origin is cheaper and quieter.

      Only the latin cut is preloaded. latin-ext is a separate face behind a
      unicode-range, so it is fetched on demand — the fixture corpus has names
      like "Niš" and pages showing one pull it, everyone else never does.

      The files are versioned in the filename because Vite copies public/
      verbatim and cannot hash them.
    -->
    <link
      rel="preload"
      href="/fonts/inter-v4.1-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* Inter 4.1 variable, subset to latin / latin-ext, wght axis clamped to
         400-800 (the opsz axis is kept: it costs nothing extra and gives the
         display cut automatically at large sizes). */
      @font-face {
        font-family: "Inter";
        src: url("/fonts/inter-v4.1-latin.woff2") format("woff2");
        font-weight: 400 800;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
          U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191,
          U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: "Inter";
        src: url("/fonts/inter-v4.1-latin-ext.woff2") format("woff2");
        font-weight: 400 800;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
          U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
          U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }

      /* Metric-matched fallbacks, so the swap moves glyph shapes and nothing
         else. Every number below was measured off the shipped subset and off
         the fallback's own file, not copied from a blog post:

           Inter 4.1   unitsPerEm 2048, hhea ascent 1984, descent -494, gap 0
                       weighted mean advance  wght 400: 0.480072 em
                                              wght 700: 0.495041 em

         size-adjust is (Inter mean advance / fallback mean advance); the
         ascent/descent overrides are then divided by it, because size-adjust
         scales the em the percentages are resolved against.

           Helvetica Neue  0.452508 em -> 106.0915%   ascent 91.3127% desc 22.7361%
           Helvetica Neue Bold 0.483821 -> 102.3191%  ascent 94.6793% desc 23.5744%
           Arial           0.446716 em -> 107.4669%   ascent 90.1441% desc 22.4451%
           Arial Bold      0.483729 em -> 102.3386%   ascent 94.6613% desc 23.5699%

         Two families rather than one: macOS has Helvetica Neue and no Arial,
         Windows the reverse, and their advance widths differ by 1.3%, which is
         enough to be worth splitting. A family whose every local() src is
         missing is simply skipped, so each platform falls through to the one it
         can actually load. Bold is a separate face because index.css sets
         font-synthesis-weight: none — without it every heading would render at
         regular weight, and at the wrong width, for the whole swap period. */
      @font-face {
        font-family: "Inter Fallback Helvetica";
        src: local("Helvetica Neue"), local("HelveticaNeue");
        font-weight: 400 550;
        font-style: normal;
        size-adjust: 106.0915%;
        ascent-override: 91.3127%;
        descent-override: 22.7361%;
        line-gap-override: 0%;
      }

      @font-face {
        font-family: "Inter Fallback Helvetica";
        src: local("Helvetica Neue Bold"), local("HelveticaNeue-Bold");
        font-weight: 551 800;
        font-style: normal;
        size-adjust: 102.3191%;
        ascent-override: 94.6793%;
        descent-override: 23.5744%;
        line-gap-override: 0%;
      }

      @font-face {
        font-family: "Inter Fallback Arial";
        src: local("Arial"), local("ArialMT"), local("Liberation Sans");
        font-weight: 400 550;
        font-style: normal;
        size-adjust: 107.4669%;
        ascent-override: 90.1441%;
        descent-override: 22.4451%;
        line-gap-override: 0%;
      }

      @font-face {
        font-family: "Inter Fallback Arial";
        src: local("Arial Bold"), local("Arial-BoldMT"), local("Liberation Sans Bold");
        font-weight: 551 800;
        font-style: normal;
        size-adjust: 102.3386%;
        ascent-override: 94.6613%;
        descent-override: 23.5699%;
        line-gap-override: 0%;
      }

      /* The stack itself lives in --font-family-sans (styles/tokens), which is
         owned elsewhere, so the two fallback families are spliced in front of
         it here rather than edited into the token. A declaration on body beats
         the value body inherits from :root whichever stylesheet lands first,
         which keeps this independent of Vite's injection order, and deferring
         to the token means this does not go stale when the tail changes. The
         token leads with "Inter" too; naming a family twice is a no-op.

         The tidier long-term home for these two is inside the token itself,
         next to "Inter" — worth folding in whenever that file settles. */
      body {
        font-family:
          "Inter", "Inter Fallback Helvetica", "Inter Fallback Arial",
          var(--font-family-sans, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
      }
    </style>

    <title>Rail — poker hand replayer &amp; hand history converter</title>
    <meta
      name="description"
      content="Replay any poker hand action by action and share it with one link. Convert hand histories from any poker room to the standard Holdem Manager format. Free, no account."
    />

    <!--
      Static defaults. Per-route tags are set client-side by
      src/routes/useDocumentMeta.ts; link-unfurl crawlers hitting /h/:slug are
      rewritten to /api/share-meta (see vercel.json), which serves per-hand tags.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rail" />
    <meta property="og:title" content="Rail — poker hand replayer &amp; hand history converter" />
    <meta
      property="og:description"
      content="Replay any poker hand action by action and share it with one link. Free, in the browser."
    />
    <meta property="og:image" content="/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rail — poker hand replayer" />
    <meta
      name="twitter:description"
      content="Replay any poker hand action by action and share it with one link. Free, in the browser."
    />
    <meta name="twitter:image" content="/og-default.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
