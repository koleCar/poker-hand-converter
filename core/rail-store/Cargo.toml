[package]
name = "rail-store"
description = "Local SQLite store: hands, statistics, quarantine, unsupported formats, sync outbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
# Native only (the app and the HUD). Never built for wasm32: CI's WebAssembly
# build names its packages with `-p` and this is not one of them, and the
# bundled SQLite and zstd are C.

[lints]
workspace = true

[dependencies]
rail-core = { path = "../rail-core" }
# The seat rows, segments and rollups (R2.3) and the hero's all-in EV.
rail-stats = { path = "../rail-stats" }
rail-equity = { path = "../rail-equity" }
# Pinned exactly (R1.2): the SQLite library is compiled in (`bundled`), so
# its version - and with it the file format's behaviour, WAL included - is
# this crate's choice, not the machine's. `cache` is `prepare_cached`.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "cache"] }
# A hand's canonical PHF is stored zstd-compressed (docs/RAIL-PLAN.md §3.4).
zstd = { version = "=0.14.2", default-features = false }
# The background pass (R2.3) reads stored PHF back into `PhfHand`, and logs
# a hand it cannot.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
log = "0.4.34"

[dev-dependencies]
# The custom statistics' tests (R2.10) build definitions (`StatDef`).
rail-config = { path = "../rail-config" }
