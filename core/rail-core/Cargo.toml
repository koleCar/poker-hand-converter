[package]
name = "rail-core"
description = "Rail core: hand-history decoding, detection, parsers, PHF model, validation, serializer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# The TypeScript parsers are regular expressions; `regex` is the port's engine.
# Its syntax differs from JavaScript's (no lookaround, Unicode `\s`, `\d`, `\b`
# and case folding by default), so every pattern is written against the JS
# semantics by hand - see `src/js.rs`.
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Refusal fingerprints are sha-256 (docs/RAIL-PLAN.md R0.5).
sha2 = "0.11.0"

[dev-dependencies]
ts-rs = { version = "12.0.1", default-features = false, features = ["serde-compat", "no-serde-warnings"] }
