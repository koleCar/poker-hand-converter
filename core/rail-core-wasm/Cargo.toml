[package]
name = "rail-core-wasm"
description = "WebAssembly facade over rail-core for the web app and the TypeScript harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rail-core = { path = "../rail-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
# Pinned exactly: the glue `wasm-bindgen-cli` generates must come from the same
# version as this crate, and `npm run wasm:build` (tests/scripts/wasm/build.mjs)
# refuses to run with any other CLI.
wasm-bindgen = "=0.2.129"

[lints]
workspace = true
