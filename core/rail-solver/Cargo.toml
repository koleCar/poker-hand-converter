[package]
name = "rail-solver"
description = "Native port of the TypeScript flop solver (web/src/lib/solver): tree, DCFR, frozen nodes, chunks (docs/NODELOCK.md §2.5)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# The hand evaluator the TypeScript solver uses (`lib/equity`), ported.
rail-core = { path = "../rail-core" }
# Turn subtrees in parallel (docs/NODELOCK.md §2.2). The version the
# workspace already pins (rail-watch, the app).
rayon = "=1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
