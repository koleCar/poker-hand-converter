name: Deploy frontend to Supabase Storage

# Production hosting moved to Vercel (auto-deploys on push to main).
# This workflow is kept as a manual fallback only - run it from the Actions tab.
#
# WARNING: the app is a client-routed SPA (/, /replay, /h/<slug>). Supabase
# Storage is a plain object store with no rewrite rules, so every route except
# the bucket root 404s on a refresh or a direct link, and shared hand links do
# not work at all. There is also no serverless function here, so crawler Open
# Graph meta (frontend/api/share-meta.ts) is unavailable. Use Vercel for
# anything user-facing; this path is only good for a quick smoke deploy.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Upload dist to Supabase Storage
        run: node scripts/deploy-frontend-to-supabase.mjs
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: frontend-site
