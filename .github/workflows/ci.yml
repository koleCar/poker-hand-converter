# The gate. Before this existed the ~2600-test suite — which is the only thing
# standing between a parser edit and silently corrupted hand histories in
# somebody's tracker database — ran solely when a human remembered to run it.
#
# Everything here must be able to run with no secrets. The suite drives the real
# fixture corpus off disk and the frontend builds into an offline converter when
# Supabase is unconfigured, so nothing in CI needs to reach the network.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Corpus tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The fixture trees are marked binary in .gitattributes precisely so
          # their CRLF / UTF-16LE / cp1252 bytes survive. Nothing here may
          # normalise them, or the byte-exactness tests would assert against
          # evidence CI itself rewrote.
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - run: npm ci
        working-directory: tests

      - name: Vitest over the real corpus
        run: npm test
        working-directory: tests

  # The golden oracle (testdata/golden/README.md, docs/RAIL-PLAN.md R0.3): what
  # the TypeScript pipeline concludes about every corpus file, which the Rust
  # core is held to byte for byte. Regenerating takes seconds; if the result is
  # not exactly what is committed, a parser change landed without its goldens
  # (or a golden was edited by hand), and the Rust side would be diffing
  # against a stale oracle. A separate job so it reports in a minute rather
  # than after the corpus suite.
  golden-fresh:
    name: golden-fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - run: npm ci
        working-directory: tests

      - name: Regenerate the goldens
        run: npm run golden:emit
        working-directory: tests

      # `git status` rather than `git diff`: it also catches a golden that is
      # missing (a new input) or left over (an input that was removed). The
      # stats goldens (R2.1, testdata/golden-stats/) and the all-in EV goldens
      # (R2.2, testdata/golden-ev/) come out of the same run: a change to
      # lib/stats or lib/equity lands with them, as a parser change lands with
      # testdata/golden/.
      - name: Goldens match what is committed
        run: |
          changes="$(git status --porcelain --untracked-files=all -- testdata/golden testdata/golden-stats testdata/golden-ev)"
          if [ -n "$changes" ]; then
            echo "::error file=testdata/golden/README.md::Goldens are stale. Run 'npm run golden:emit' in tests/ and commit testdata/golden/, testdata/golden-stats/ and testdata/golden-ev/ in the same PR as the parser, stats or equity change."
            echo "$changes" | head -100
            git --no-pager diff --stat -- testdata/golden testdata/golden-stats testdata/golden-ev | tail -20
            git --no-pager diff -- testdata/golden testdata/golden-stats testdata/golden-ev | head -300
            exit 1
          fi
          echo "Goldens are fresh."

  frontend:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      # Errors fail the build; the four known react-hooks / react-refresh
      # warnings are deliberate and explained in eslint.config.js.
      - run: npm run lint
        working-directory: frontend

      # The token layering from #11 is only worth anything if it is enforced:
      # no primitive ramp (`--n-800`) and no raw hex in `src/`. The token layer
      # itself, and the deliberately unthemed felt, cards and chips
      # (`replayer.css`, `cards.css`, exempt from the hex rule), are the shared
      # UI package's since R2.6; the `ui` job lints them.
      - name: Lint stylesheets
        run: npm run lint:css
        working-directory: frontend

      - name: Typecheck
        run: npx tsc -b
        working-directory: frontend

      # Catches anything tsc's project references miss — a bad asset import, a
      # worker URL the bundler cannot resolve.
      - name: Build
        run: npm run build
        working-directory: frontend

  # The shared UI package (docs/RAIL-PLAN.md R2.6): tokens and the components
  # the web and the desktop app both render, consumed as source (`file:` links
  # from frontend/ and app/), so there is nothing to build here. Both consumer
  # jobs typecheck and bundle it again under their own settings; this job
  # holds it to its own rules - ESLint (no Supabase, Tauri or Next imports, no
  # user-facing literals, the web's pure library only through model/),
  # stylelint (the token rules: no primitive and no raw hex outside tokens/)
  # and tsc.
  ui:
    name: Shared UI package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/ui/package-lock.json

      - run: npm ci
        working-directory: packages/ui

      - run: npm run lint
        working-directory: packages/ui

      - name: Lint stylesheets
        run: npm run lint:css
        working-directory: packages/ui

      - name: Typecheck
        run: npm run typecheck
        working-directory: packages/ui

  # The Rust workspace: Rail core, the desktop crates and the HUD
  # (docs/RAIL-PLAN.md R0.1). Every pull request builds on macOS and Windows
  # (guideline §14), and Linux is the cheapest runner for the WebAssembly build
  # the web app will use. The toolchain comes from rust-toolchain.toml, which
  # rustup on the runner installs on the first cargo call.
  #
  # `cargo test` includes the golden round trip (R0.4): every corpus hand's
  # PHF deserialized into the Rust model and re-serialized byte for byte. The
  # bodies it reads are the gitignored testdata/golden-full/, which the
  # TypeScript emitter writes in ~15 s, so Node runs here first on every OS.
  # The test checks those bodies against the committed hashes before using
  # them, and fails rather than skips when they are missing. The stats golden
  # diff (R2.1, core/rail-stats/tests/corpus.rs) reads the same bodies and
  # compares rail-stats' rows with the hashes in testdata/golden-stats/; the
  # all-in EV diff (R2.2, core/rail-equity/tests/corpus.rs) does the same
  # against testdata/golden-ev/.
  #
  # The HUD crates (R3.2: hud/rail-hud, hud/rail-hud-ipc) are in the
  # workspace run on all three systems: the protocol and handshake tests, the
  # real socket / named pipe, the supervisor with the real `rail-hud` binary
  # (start, health, kill and restart, strangers refused), and the headless
  # end-to-end test - the simulator's hands through the watcher and the store
  # to the HUD process, an allowed room attached and a prohibited one
  # refused (hud/rail-hud/tests/e2e.rs; it uses the rail-hud-sim binary the
  # same `cargo test` builds). On Windows only, the same `cargo test` also
  # runs R3.3's hud/rail-hud/tests/windows_tables.rs: three simulator
  # windows on the runner's desktop, found by the Win32 backend with their
  # table names, client rects and scale, followed through a minimise and a
  # table move, listed (redacted) by `rail-hud --list-windows`, attached
  # and refused by the HUD process; a failure prints every window Windows
  # reported. And R3.4's hud/rail-hud/tests/windows_overlay.rs: an overlay
  # per simulator table, owned by it, layered / tool / no-activate, exactly
  # over its client area, panels at the seats (surface and screen pixels),
  # clicks through everywhere but the panels, hidden while minimised, moved
  # without a repaint; the HUD process draws on an allowed room's tables
  # and makes no overlay window on a prohibited room's. And R3.5's
  # hud/rail-hud/tests/windows_tracking.rs: WinEvent hooks follow scripted
  # SetWindowPos moves, the simulator's move / resize / minimise / table
  # move / close, a hidden and shown table, a hundred moves in a second and
  # the simulator's exit, in the backend and through the HUD process with
  # the simulator's tracking script. And R3.6's
  # hud/rail-hud/tests/windows_seats.rs: panels at the seats the simulator
  # draws with `--preferred-seat` off and on (its gold hero frame read off
  # the screen where the HUD puts the hero), a panel dragged with posted
  # mouse messages - kept clear of the table graphics posing as ACR, where
  # dropped posing as PokerStars -, and the HUD process: drag ->
  # `seat_position_changed` -> the store -> a restarted HUD puts it back.
  # And R3.9's hud/rail-hud/tests/windows_designs.rs: the engine over the
  # real backend and a real store - an assigned design changes what the
  # overlay draws, a card-split statistic is dropped posing as PokerStars.
  # And R3.10's hud/rail-hud/tests/windows_compliance.rs: a table posing as
  # a prohibited room refused and listed with its reason, no overlay; a
  # remote policy (`--policy`) refusing, then detaching, an allowed one.
  # On macOS only, R3.11's hud/rail-hud/tests/macos_tables.rs: three
  # simulator windows in the window server's list with the simulator's
  # frames at the screen's scale, joined into tables; then, if the runner
  # gives the test process the Accessibility permission, the backend's own
  # find by accessibility titles (minimise, table move, `--list-windows`,
  # the HUD process attaching and refusing), and if it does not, the
  # "permission needed" path - the test says which ran and what it skipped.
  # And R3.12's hud/rail-hud/tests/macos_overlay.rs (its own `main`, AppKit
  # on the main thread; elsewhere it prints that it skipped): overlays over
  # the simulator's three windows, exactly over their client areas and
  # directly above them in the window server's order, their pixels on
  # screen, clicks through everywhere but the panels, a raised table put
  # back under its overlay, minimise / restore / move, the panels' click and
  # drag; with the Accessibility permission real clicks, the HUD process
  # drawing on an allowed room and making no window on a prohibited one,
  # and the popup through the supervisor.
  # And R3.13's hud/rail-hud/tests/macos_tracking.rs (its own `main` too):
  # without a permission, a wrong description never placing an overlay, a
  # (simulated) Space change re-reading every table, a killed simulator's
  # overlays gone at once; with Accessibility, the observers - a scripted
  # drag and 100 moves in 1 s followed move by move (lag, CPU), resize,
  # minimise / restore, focus restacking, a real click, a table move, the
  # application hidden and shown, a close - and the HUD process following
  # the simulator's tracking script.
  #
  # The desktop app's crate (`rail-app`, app/src-tauri) is left out of clippy
  # and test here and has its own job, `app`, below: on Linux Tauri needs the
  # WebKitGTK development packages, and compiling Tauri in both jobs on every
  # OS would double the cost of each run for nothing. `cargo fmt --all` still
  # covers it.
  core:
    name: Rust core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - run: npm ci
        working-directory: tests

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --exclude rail-app --all-targets --locked -- -D warnings

      - name: Full goldens for the round trip
        run: npm run golden:emit
        working-directory: tests

      # Also fails when core/rail-core-wasm/types/phf.d.ts is not what the
      # Rust model generates (phf::dts).
      - name: Test
        run: cargo test --workspace --exclude rail-app --locked

      # The table simulator with its windows (docs/RAIL-PLAN.md R3.1): three
      # tables, twenty hands into a temporary folder, exit; every window
      # must show a frame (a `window` event each), and the folder must read
      # back through rail_core as PokerStars hands. macOS and Windows runners
      # have a desktop session; on Linux the headless run in `cargo test`
      # (hud/rail-hud-sim/tests/smoke.rs) is the check.
      # R3.4's measurement: twelve simulator tables, every overlay painted
      # 20 times (paint p50 / p95 / max; p95 must stay under 16 ms), then
      # the idle CPU of the overlays and of the HUD process attached to all
      # twelve. The `R3.4 perf:` line is the record (docs/RAIL-PLAN.md R3.4).
      - name: HUD overlays, twelve tables (measurement)
        if: matrix.os == 'windows-latest'
        run: cargo test -p rail-hud --test windows_overlay --locked -- --ignored --nocapture twelve_tables_perf

      # R3.5's tracking tests again, with their output: the `R3.5 ...`
      # lines are the follow lag (table moved -> overlay moved, p50 / p95),
      # the storm's CPU and the hide / show times docs/RAIL-PLAN.md records.
      - name: HUD tracking (measurement)
        if: matrix.os == 'windows-latest'
        run: cargo test -p rail-hud --test windows_tracking --locked -- --nocapture --test-threads 1

      # R3.6's seat and drag tests again, with their per-step output
      # (`step ok: ...`: which seat, which slot, where a panel was dropped).
      - name: HUD seats and layouts (steps)
        if: matrix.os == 'windows-latest'
        run: cargo test -p rail-hud --test windows_seats --locked -- --nocapture --test-threads 1

      # R3.9's designs on real windows, with their per-step output: an
      # assigned design changes what the overlay draws (posing as Winamax),
      # and a card-split statistic of the user's is dropped posing as
      # PokerStars.
      - name: HUD designs (steps)
        if: matrix.os == 'windows-latest'
        run: cargo test -p rail-hud --test windows_designs --locked -- --nocapture --test-threads 1

      # R3.10's compliance mode on a real window, with its per-step output:
      # posing as GGPoker the table is refused and listed (room, table,
      # reason) in the HUD's health answer - the app's refused list - with no
      # overlay anywhere; posing as PokerStars with the app's remote copy
      # switching it off (`--policy`) it is refused from the first look,
      # attached under the shipped policy, and detached again (the overlay
      # gone) when the remote copy comes back.
      - name: HUD compliance mode (steps)
        if: matrix.os == 'windows-latest'
        run: cargo test -p rail-hud --test windows_compliance --locked -- --nocapture --test-threads 1

      # R3.11's macOS tables test again, with its output: the `R3.11:` line
      # says whether the runner's test process has the Accessibility
      # permission (the backend's own find ran) or not (the window server's
      # path and the "permission needed" path ran; the rest is listed as
      # skipped), then each step's windows.
      - name: HUD tables on macOS (steps)
        if: matrix.os == 'macos-latest'
        run: cargo test -p rail-hud --test macos_tables --locked -- --nocapture --test-threads 1

      # R3.12's macOS overlay test again, with its output (its own `main`:
      # AppKit runs on the test's main thread): the `R3.12:` lines say
      # whether real clicks and the HUD process ran (they need the
      # Accessibility permission, which the runner gave R3.11's test), then
      # each step - overlays exactly over the simulator's tables and
      # directly above them, pixels on screen, clicks through, raised /
      # minimised / moved tables.
      - name: HUD overlays on macOS (steps)
        if: matrix.os == 'macos-latest'
        run: cargo test -p rail-hud --test macos_overlay --locked -- --nocapture

      # R3.12's measurement: twelve simulator tables, every overlay painted
      # 20 times (paint p50 / p95 / max; p95 must stay under 16 ms), the
      # overlays' idle CPU and, with Accessibility, the HUD process attached
      # to all twelve. The `R3.12 perf:` line is the record.
      - name: HUD overlays on macOS, twelve tables (measurement)
        if: matrix.os == 'macos-latest'
        run: cargo test -p rail-hud --test macos_overlay --locked -- --perf --nocapture

      # R3.13's macOS tracking test again, with its output: the `R3.13:`
      # lines say whether the observers ran (Accessibility) and what was
      # skipped or simulated (a Space switch); the `R3.13 drag` / `storm` /
      # `focus` / `click` / `hide` / `exit` lines are the measurements.
      # Correctness (every table followed, never back, never hidden, no CPU
      # spike) and the typical lag (p50 under two frames) are gated here;
      # the storm's p95 is printed, not gated: the runner's virtual window
      # server stalls a reading for ~0.5 s now and then. R3.14 gates it at
      # three frames on real hardware (`RAIL_HUD_REAL_HW=1`).
      - name: HUD tracking on macOS (steps and measurement)
        if: matrix.os == 'macos-latest'
        run: cargo test -p rail-hud --test macos_tracking --locked -- --nocapture

      - name: Table simulator, windowed smoke
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        run: |
          out="$RUNNER_TEMP/rail-hud-sim-smoke"
          events="$RUNNER_TEMP/rail-hud-sim-events.jsonl"
          cargo run --locked -q -p rail-hud-sim -- --tables 3 --hands 20 --speed 1200 --linger 500 --no-stdin --out "$out" > "$events"
          windows=$(grep -o '"event":"window","table":[0-9]*' "$events" | sort -u | wc -l)
          echo "tables whose window showed a frame: $windows"
          test "$windows" -eq 3
          cargo run --locked -q -p rail-hud-sim -- verify --room pokerstars --out "$out" --hands 20

      # The generated declarations against frontend/src/lib/phf/types.ts,
      # type by type (tests/scripts/phf-dts/check.ts). The same on every OS.
      - name: Declarations match types.ts
        if: matrix.os == 'ubuntu-latest'
        run: npm run phf:dts-check
        working-directory: tests

      - name: WebAssembly build
        if: matrix.os == 'ubuntu-latest'
        run: cargo build -p rail-core -p rail-core-wasm -p rail-config -p rail-stats -p rail-equity --target wasm32-unknown-unknown --locked

  # The desktop app (docs/RAIL-PLAN.md R1.1): Tauri 2 in app/. Every pull
  # request gets an unsigned bundle for macOS and Windows to download and try
  # (guideline §14), kept 7 days. No signing, no secrets: signing and
  # notarisation belong to the release workflow (§12, P3/P4), never to PR
  # builds.
  #
  # - Linux: TypeScript lint, CSS lint, typecheck, and clippy + tests of the
  #   app crate against the WebKitGTK packages (Linux is not shipped; this
  #   keeps the crate compiling there and is the cheapest runner for the web
  #   side's checks).
  # - macOS: `.app` and `.dmg` for the runner's own architecture (Apple
  #   silicon on macos-latest). A universal binary would compile the whole
  #   app twice, once per architecture; the release workflow does that.
  # - Windows: an NSIS installer (per-user, no admin rights).
  #
  # Bundles are built with LTO off and parallel codegen (the env below
  # overrides the workspace's release profile for this job only): they are
  # for trying a pull request, not for shipping, and a thin-LTO,
  # single-codegen-unit Tauri build costs minutes per run.
  app:
    name: Desktop app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
            bundles: app,dmg
            artifact: target/release/bundle/dmg/*.dmg
          - os: windows-latest
            bundles: nsis
            artifact: target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      # The desktop sign-in (R1.7) compiles in the project's public anon key
      # (the same value the web ships in its JavaScript). A repository
      # *variable*, not a secret; empty until the owner sets it, and then the
      # bundle says sign-in is not available and works offline.
      RAIL_SUPABASE_ANON_KEY: ${{ vars.RAIL_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux prerequisites (https://v2.tauri.app/start/prerequisites/).
      - name: WebKitGTK and friends
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      - name: Lint (TypeScript)
        if: runner.os == 'Linux'
        run: npm run lint
        working-directory: app

      - name: Lint (stylesheets)
        if: runner.os == 'Linux'
        run: npm run lint:css
        working-directory: app

      - name: Typecheck
        if: runner.os == 'Linux'
        run: npm run typecheck
        working-directory: app

      - name: Clippy (app crate)
        run: cargo clippy -p rail-app --all-targets --locked -- -D warnings

      # One test at a time with its output: libtest prints `test <name> ...`
      # as each one starts, so a crash names the test it happened in, after
      # the test's own `step ok` lines (the HUD popup's window tests). A
      # test binary that Windows refuses to start names no test at all:
      # cargo's "process didn't exit successfully" line has its exit code -
      # 0xc0000139 (STATUS_ENTRYPOINT_NOT_FOUND) was a missing application
      # manifest (src-tauri/build.rs).
      - name: Test (app crate)
        run: cargo test -p rail-app --locked -- --nocapture --test-threads 1

      # The HUD process is the app's Tauri sidecar (docs/RAIL-PLAN.md R3.2):
      # `rail-hud` built in release and copied to
      # src-tauri/binaries/rail-hud-<target triple> for the bundler
      # (`bundle.externalBin` in src-tauri/tauri.hud.conf.json), which puts
      # it next to the app's executable - where the app starts it from.
      - name: HUD sidecar
        if: runner.os != 'Linux'
        run: npm run hud:sidecar
        working-directory: app

      # `tauri build` runs `npm run build` (tsc + vite) first, then the
      # release build and the bundler.
      - name: Unsigned bundle
        if: runner.os != 'Linux'
        run: npm run tauri -- build --ci --bundles ${{ matrix.bundles }} --config src-tauri/tauri.hud.conf.json
        working-directory: app

      # The sidecar made it in: in the .app beside the app's binary (and it
      # runs), and in the NSIS installer's file list.
      - name: The HUD is in the bundle
        if: runner.os != 'Linux'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            hud=target/release/bundle/macos/Rail.app/Contents/MacOS/rail-hud
            test -x "$hud"
            "$hud" --help 2>&1 | head -2
          else
            nsi=$(find target/release/nsis -name installer.nsi | head -1)
            echo "$nsi"
            grep -n "rail-hud" "$nsi"
          fi

      - uses: actions/upload-artifact@v4
        if: runner.os != 'Linux'
        with:
          name: rail-unsigned-${{ runner.os }}-${{ runner.arch }}
          path: ${{ matrix.artifact }}
          retention-days: 7
          if-no-files-found: error

  # The import benchmark (docs/RAIL-PLAN.md R1.6). The guideline's target
  # (§1: local import of old hands >= 5,000 hands/s) is about a user's
  # machine and is measured on the owner's M2 Pro (10,300 hands/s at 100k
  # hands, 8 threads; R1.6 "As built"). This job is a **regression guard**
  # for the import pipeline, and it gates on a ratio, not on hands/s:
  # macos-latest is an Apple M1 (Virtual) with 3 cores whose speed moves
  # from job to job (the same code measured best-of-runs 3,436 to 5,264
  # hands/s), so an absolute gate failed unrelated PRs on runner noise.
  #
  # The example measures a REFERENCE on this runner - one thread converting
  # the corpus (7.3k hands) from memory with rail_core, no store, no
  # watcher, ~3 s - before the first import and after each import; a run's
  # reference is the mean of the passes around its import (the runner's
  # speed moves within seconds). Each run's PIPELINE EFFICIENCY = hands
  # stored/s / (reference hands/s x import threads). A slow runner slows
  # both; a regression in reading, the writer, the store or the watcher
  # lowers the ratio. Best of three runs; fails below
  # 45 % (calibrated in R1.6 "As built"), or below an absolute floor of
  # 1,500 hands/s (a catastrophic slowdown, rail_core's own included, which
  # the ratio cannot see since it slows the reference too).
  #
  # The example builds a GENERATED dataset of ~100k hands on the fly in the
  # runner's temp directory (the corpus with rewritten hand ids; nothing is
  # committed, nothing goes under testdata/ or a fixture tree), imports it
  # through the real watcher into an empty store and prints hands stored
  # per second. Release profile as shipped (thin LTO), cached by rust-cache.
  # Import threads: every core of the runner (3); the app's default is
  # physical cores - 1, capped at 8. Deliberately the stricter setting: the
  # writer, the committer and the coordinator take their CPU from the three
  # import threads here, and the threads also compress and derive the
  # statistics (~a third on top of the reference's conversion), so the
  # ratio cannot reach 100 % (about 60-65 % is the ceiling on a busy
  # 3-core runner; R2.7c "Import writer, second pass"). With 2 threads
  # (the app's default here) it would read higher and the 45 % gate would
  # have to be calibrated again.
  import-bench:
    name: Import benchmark (macOS runner, gate on pipeline efficiency vs a same-runner reference)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          key: import-bench

      - name: Build (release)
        run: cargo build --release --locked -p rail-watch --example import_bench

      - name: Reference conversion, then import 100k generated hands into an empty store
        run: |
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize || true
          ./target/release/examples/import_bench \
            --hands 100000 --workers "$(sysctl -n hw.ncpu)" --runs 3 \
            --min-efficiency 45 --min-rate 1500 \
            --dir "$RUNNER_TEMP/rail-import-bench"

  # The WebAssembly core and shadow mode (docs/RAIL-PLAN.md R0.13): the core
  # built for the browser with wasm-bindgen, its size held to the plan's
  # budget (< 1.5 MB gzipped), and then run next to the TypeScript pipeline
  # over every corpus file - the golden diff under WASM, which with the
  # `core` job's native diff on three OSes is the Phase 0 exit check. A job
  # of its own so it runs beside the `core` matrix rather than after it.
  #
  # wasm-bindgen-cli must be the exact version of the wasm-bindgen crate in
  # Cargo.lock; rust-cache keeps ~/.cargo/bin, so it is compiled only when the
  # cache is cold or the version moves.
  wasm:
    name: WebAssembly core, shadow mode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - run: npm ci
        working-directory: tests

      - name: wasm-bindgen-cli (the version in Cargo.lock)
        run: |
          version="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
          if [ "$(wasm-bindgen --version 2>/dev/null)" != "wasm-bindgen $version" ]; then
            cargo install wasm-bindgen-cli --version "$version" --locked
          fi
          wasm-bindgen --version

      - name: Build, size budget
        run: npm run wasm:build
        working-directory: tests

      # Every corpus file through the TypeScript pipeline and the WASM core;
      # also prints the throughput of both.
      - name: Shadow mode
        run: npm run wasm:shadow
        working-directory: tests

  database:
    name: Migrations and pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A migration that returns 201 proves the SQL ran, not that the grants,
      # the definer functions and the reservation rules do what they claim
      # (docs/DATABASE.md, "Do not trust a 201"). This applies every migration
      # in order to a throwaway Postgres -- the same image Supabase runs -- and
      # then runs `supabase/tests/**`, which act as `anon` and `authenticated`
      # for real rather than as a superuser. No secrets: nothing here talks to
      # the live project.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0

      - name: Start Postgres and apply every migration
        run: supabase db start

      # The client is typed from the schema (#8). A migration that changes a
      # table or a function signature without regenerating the types would
      # leave the app compiling against a schema that no longer exists, so the
      # checked-in file has to be exactly what these migrations produce.
      - name: Generated types match the migrations
        run: |
          supabase gen types typescript --local --schema public > "$RUNNER_TEMP/database.types.ts"
          if ! diff -u frontend/src/lib/db/database.types.ts "$RUNNER_TEMP/database.types.ts"; then
            echo "::error file=frontend/src/lib/db/database.types.ts::Stale. Regenerate with: supabase gen types typescript --local --schema public > frontend/src/lib/db/database.types.ts"
            exit 1
          fi

      - name: pgTAP
        run: supabase test db

  # The desktop sign-in's Edge Function (docs/RAIL-PLAN.md R1.7):
  # supabase/functions/desktop-handoff. Format, lint, type check and the unit
  # tests - the handoff payload (including the test vector the Rust side
  # opens too) and the handler against a fake GoTrue. No network, no secrets,
  # nothing deployed; the end-to-end run against a local stack is
  # `supabase/functions/desktop-handoff/e2e.sh` (needs Docker).
  functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.6.8

      - name: Format
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check desktop-handoff/*.ts desktop-handoff/testdata/*.ts

      - name: Test
        run: deno test --allow-read=.

  fixtures:
    name: Fixture bytes unchanged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `git diff --check`-style guard for the one failure mode .gitattributes
      # exists to prevent: a machine with core.autocrlf=input rewriting a CRLF
      # fixture to LF on commit, which leaves the working tree looking correct
      # while the stored blob is no longer the bytes the room actually wrote.
      - name: Assert fixtures are byte-identical to HEAD
        run: |
          git config core.autocrlf false
          git checkout -- .
          if ! git diff --quiet -- fixtures gg-hh weplay-hh tests/test/fixtures; then
            echo "::error::Fixture bytes changed on checkout — .gitattributes binary marking is not holding."
            git diff --stat -- fixtures gg-hh weplay-hh tests/test/fixtures
            exit 1
          fi
          echo "Fixture trees are intact."
