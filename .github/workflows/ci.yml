# The gate. Before this existed the ~2600-test suite — which is the only thing
# standing between a parser edit and silently corrupted hand histories in
# somebody's tracker database — ran solely when a human remembered to run it.
#
# Everything here must be able to run with no secrets. The suite drives the real
# fixture corpus off disk and the frontend builds into an offline converter when
# Supabase is unconfigured, so nothing in CI needs to reach the network.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Corpus tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The fixture trees are marked binary in .gitattributes precisely so
          # their CRLF / UTF-16LE / cp1252 bytes survive. Nothing here may
          # normalise them, or the byte-exactness tests would assert against
          # evidence CI itself rewrote.
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - run: npm ci
        working-directory: tests

      - name: Vitest over the real corpus
        run: npm test
        working-directory: tests

  # The golden oracle (testdata/golden/README.md, docs/RAIL-PLAN.md R0.3): what
  # the TypeScript pipeline concludes about every corpus file, which the Rust
  # core is held to byte for byte. Regenerating takes seconds; if the result is
  # not exactly what is committed, a parser change landed without its goldens
  # (or a golden was edited by hand), and the Rust side would be diffing
  # against a stale oracle. A separate job so it reports in a minute rather
  # than after the corpus suite.
  golden-fresh:
    name: golden-fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - run: npm ci
        working-directory: tests

      - name: Regenerate the goldens
        run: npm run golden:emit
        working-directory: tests

      # `git status` rather than `git diff`: it also catches a golden that is
      # missing (a new input) or left over (an input that was removed).
      - name: Goldens match what is committed
        run: |
          changes="$(git status --porcelain --untracked-files=all -- testdata/golden)"
          if [ -n "$changes" ]; then
            echo "::error file=testdata/golden/README.md::Goldens are stale. Run 'npm run golden:emit' in tests/ and commit testdata/golden/ in the same PR as the parser change."
            echo "$changes" | head -100
            git --no-pager diff --stat -- testdata/golden | tail -20
            git --no-pager diff -- testdata/golden | head -300
            exit 1
          fi
          echo "Goldens are fresh."

  frontend:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      # Errors fail the build; the four known react-hooks / react-refresh
      # warnings are deliberate and explained in eslint.config.js.
      - run: npm run lint
        working-directory: frontend

      # The token layering from #11 is only worth anything if it is enforced:
      # no primitive ramp (`--n-800`) and no raw hex outside `src/styles/tokens/`.
      # `replayer.css` and `cards.css` are exempt from the hex rule on purpose —
      # the felt, the cards and the chips are deliberately unthemed.
      - name: Lint stylesheets
        run: npm run lint:css
        working-directory: frontend

      - name: Typecheck
        run: npx tsc -b
        working-directory: frontend

      # Catches anything tsc's project references miss — a bad asset import, a
      # worker URL the bundler cannot resolve.
      - name: Build
        run: npm run build
        working-directory: frontend

  # The Rust workspace: Rail core, the desktop crates and the HUD
  # (docs/RAIL-PLAN.md R0.1). Every pull request builds on macOS and Windows
  # (guideline §14), and Linux is the cheapest runner for the WebAssembly build
  # the web app will use. The toolchain comes from rust-toolchain.toml, which
  # rustup on the runner installs on the first cargo call.
  #
  # `cargo test` includes the golden round trip (R0.4): every corpus hand's
  # PHF deserialized into the Rust model and re-serialized byte for byte. The
  # bodies it reads are the gitignored testdata/golden-full/, which the
  # TypeScript emitter writes in ~15 s, so Node runs here first on every OS.
  # The test checks those bodies against the committed hashes before using
  # them, and fails rather than skips when they are missing.
  core:
    name: Rust core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - run: npm ci
        working-directory: tests

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Full goldens for the round trip
        run: npm run golden:emit
        working-directory: tests

      # Also fails when core/rail-core-wasm/types/phf.d.ts is not what the
      # Rust model generates (phf::dts).
      - name: Test
        run: cargo test --workspace --locked

      # The generated declarations against frontend/src/lib/phf/types.ts,
      # type by type (tests/scripts/phf-dts/check.ts). The same on every OS.
      - name: Declarations match types.ts
        if: matrix.os == 'ubuntu-latest'
        run: npm run phf:dts-check
        working-directory: tests

      - name: WebAssembly build
        if: matrix.os == 'ubuntu-latest'
        run: cargo build -p rail-core -p rail-core-wasm --target wasm32-unknown-unknown --locked

  database:
    name: Migrations and pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A migration that returns 201 proves the SQL ran, not that the grants,
      # the definer functions and the reservation rules do what they claim
      # (docs/DATABASE.md, "Do not trust a 201"). This applies every migration
      # in order to a throwaway Postgres -- the same image Supabase runs -- and
      # then runs `supabase/tests/**`, which act as `anon` and `authenticated`
      # for real rather than as a superuser. No secrets: nothing here talks to
      # the live project.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0

      - name: Start Postgres and apply every migration
        run: supabase db start

      # The client is typed from the schema (#8). A migration that changes a
      # table or a function signature without regenerating the types would
      # leave the app compiling against a schema that no longer exists, so the
      # checked-in file has to be exactly what these migrations produce.
      - name: Generated types match the migrations
        run: |
          supabase gen types typescript --local --schema public > "$RUNNER_TEMP/database.types.ts"
          if ! diff -u frontend/src/lib/db/database.types.ts "$RUNNER_TEMP/database.types.ts"; then
            echo "::error file=frontend/src/lib/db/database.types.ts::Stale. Regenerate with: supabase gen types typescript --local --schema public > frontend/src/lib/db/database.types.ts"
            exit 1
          fi

      - name: pgTAP
        run: supabase test db

  fixtures:
    name: Fixture bytes unchanged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `git diff --check`-style guard for the one failure mode .gitattributes
      # exists to prevent: a machine with core.autocrlf=input rewriting a CRLF
      # fixture to LF on commit, which leaves the working tree looking correct
      # while the stored blob is no longer the bytes the room actually wrote.
      - name: Assert fixtures are byte-identical to HEAD
        run: |
          git config core.autocrlf false
          git checkout -- .
          if ! git diff --quiet -- fixtures gg-hh weplay-hh tests/test/fixtures; then
            echo "::error::Fixture bytes changed on checkout — .gitattributes binary marking is not holding."
            git diff --stat -- fixtures gg-hh weplay-hh tests/test/fixtures
            exit 1
          fi
          echo "Fixture trees are intact."
