# Rail core, desktop and HUD crates (docs/RAIL-PLAN.md §3.1).
#
# The web app and the TypeScript test harness are npm projects and live outside
# this workspace; `rail-core-wasm` is how they will reach the Rust core.

[workspace]
resolver = "3"
members = [
  "core/rail-core",
  "core/rail-core-wasm",
  "core/rail-stats",
  "core/rail-equity",
  "core/rail-store",
  "core/rail-watch",
  "core/rail-sync",
  "core/rail-config",
  "hud/rail-hud",
  "hud/rail-hud-sim",
  "app/src-tauri",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
# The licence is an open decision (docs/RAIL-PLAN.md P8, Q7). Until it is made,
# nothing here is published.
publish = false
repository = "https://github.com/koleCar/poker-hand-converter"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Money is integer minor units everywhere (docs/PHF-SPEC.md §1). A silent
# `as` between integer widths, or into a float, is how an amount goes wrong
# without anything failing.
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
float_arithmetic = "deny"
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"

# The golden round-trip test (core/rail-core/tests/golden_roundtrip.rs) reads
# ~130 MB of JSON; unoptimised serde_json makes that the slowest test by far.
[profile.dev.package.serde_json]
opt-level = 3

# The parser tests run every corpus file (and tens of thousands of vector
# cases) through regex matching and sha-256: optimised, the dependencies
# that do that work keep the debug test run short. Our own crates stay
# unoptimised (debug assertions, overflow checks).
[profile.dev.package.regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
[profile.dev.package.aho-corasick]
opt-level = 3
[profile.dev.package.memchr]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

# rail-equity (R2.2): its tests enumerate every all-in of the corpus, 226 of
# them preflop (1.4-1.7M boards each); unoptimised that is minutes per run.
# Optimised, with debug assertions and overflow checks still on (only the
# opt-level changes). The evaluator's hot functions in rail-core are
# `#[inline]`, so they are compiled here, at this level, too.
[profile.dev.package.rail-equity]
opt-level = 3

# rail-store's C (R1.2): SQLite and zstd compiled at -O0 make the store's
# tests (the corpus imports and the crash test) several times slower.
[profile.dev.package.libsqlite3-sys]
opt-level = 3
[profile.dev.package.zstd-sys]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# The WebAssembly core (R0.13, `npm run wasm:build` in tests/): one download
# per visitor, so size first. Fat LTO and one codegen unit let the linker
# drop what the facade does not reach; `panic = "abort"` is what wasm32 does
# anyway and drops the unwinding tables. Opt level chosen by measurement
# (docs/RAIL-PLAN.md R0.13 as built).
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
