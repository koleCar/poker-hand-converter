[package]
name = "rail-hud"
description = "HUD overlay process for Windows and macOS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "rail_hud"
path = "src/lib.rs"

# The process the app starts as its sidecar (docs/RAIL-PLAN.md R3.2).
[[bin]]
name = "rail-hud"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# Compliance mode: the shipped sites.json, merged with a remote copy by
# R0.12's rules; `hud_permitted()` is the one question.
rail-config = { path = "../../core/rail-config" }
# The parser ids `rail_config::load_shipped` checks coverage against.
rail-core = { path = "../../core/rail-core" }
# The read path: the store opened read-only, `Reader::hud_totals`.
rail-store = { path = "../../core/rail-store" }
# The panel's statistics (R3.4): the shipped definitions whose `hud` is
# `panel`, their bands and R2.5's reliability, over `Totals::sums()`.
rail-stats = { path = "../../core/rail-stats" }
rail-hud-ipc = { path = "../rail-hud-ipc" }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Windows (R3.3 - R3.5): the Win32 calls, behind `platform::windows`'s
# small `unsafe` wrappers. The version the app's Tauri already locks (one
# copy in the build); only the API families used. R3.4's overlays draw
# with Direct2D and DirectWrite into a DIB that `UpdateLayeredWindow`
# shows (features only: no new crate in Cargo.lock). R3.5's WinEvent hooks
# (`SetWinEventHook`) are `Win32_UI_Accessibility`; R3.6's panel drag takes
# the mouse capture (`SetCapture`, `Win32_UI_Input_KeyboardAndMouse`).
# R3.14's twelve-table test reads the HUD process's working set
# (`K32GetProcessMemoryInfo`, `Win32_System_ProcessStatus`).
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

# macOS (R3.11): the window server's list (`CGWindowListCopyWindowInfo`)
# and the displays' scale from Core Graphics, the window titles from the
# Accessibility API (`AXUIElement`), behind `platform::macos::ffi`'s small
# `unsafe` wrappers. objc2's generated bindings at the 0.3.2 line the app's
# Tauri (tao, wry) already locks; only `objc2-application-services` is new
# to Cargo.lock, from the same release. `libc` (already locked) for
# `proc_pidpath` (a process's executable) and `dlsym`.
#
# (R3.12) The overlays: AppKit (`NSApplication`, `NSPanel`, `NSEvent`) on
# the main thread, a layer-hosting view (`CALayer`, Quartz Core) showing a
# bitmap that Core Graphics paints (`CGBitmapContext`, `CGPath`) with Core
# Text's lines (`CTLine`, `CTFont`); `dispatch2` wakes the main thread when
# the engine hands it something; `objc2` for `MainThreadMarker` and
# `Retained`. Every one is already in Cargo.lock at exactly these versions
# (Tauri's tao and wry use them): no new crate, only features and the
# edges to them. `CGEvent` posts real clicks for the overlay test only
# (`platform::macos::drive`).
#
# (R3.13) Tracking: an `AXObserver` per poker process on a thread of its
# own with its own `CFRunLoop` (`CFRunLoop`, `CFDate` for
# `CFRunLoopRunInMode`); `NSWorkspace`'s Space notification with a block
# (`block2`, `NSNotification`, `NSOperation` for the observer call's
# signature); `libc`'s `kqueue` for the clients' exits. `block2` 0.6.2 is
# in Cargo.lock already (objc2's): again no new crate.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.190"
block2 = { version = "=0.6.2", default-features = false, features = ["std"] }
dispatch2 = { version = "=0.3.1", default-features = false, features = ["std"] }
objc2 = { version = "=0.6.5", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
  "std",
  "NSApplication",
  "NSColor",
  "NSEvent",
  "NSGraphics",
  "NSGraphicsContext",
  "NSPanel",
  "NSResponder",
  "NSRunningApplication",
  "NSView",
  "NSWindow",
  "NSWorkspace",
  "libc",
  "objc2-core-foundation",
  "objc2-quartz-core",
] }
objc2-application-services = { version = "=0.3.2", default-features = false, features = [
  "std",
  "libc",
  "HIServices",
  "AXError",
  "AXUIElement",
  "AXValue",
] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "objc2",
  "CFArray",
  "CFAttributedString",
  "CFCGTypes",
  "CFDate",
  "CFDictionary",
  "CFNumber",
  "CFRunLoop",
  "CFString",
] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = [
  "std",
  "CGAffineTransform",
  "CGBitmapContext",
  "CGColorSpace",
  "CGContext",
  "CGDirectDisplay",
  "CGError",
  "CGEvent",
  "CGEventTypes",
  "CGGeometry",
  "CGImage",
  "CGPath",
  "CGRemoteOperation",
  "CGWindow",
] }
objc2-core-text = { version = "=0.3.2", default-features = false, features = [
  "std",
  "CTFont",
  "CTLine",
  "CTStringAttributes",
  "objc2-core-graphics",
] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "block2",
  "NSArray",
  "NSDate",
  "NSEnumerator",
  "NSGeometry",
  "NSNotification",
  "NSObjCRuntime",
  "NSOperation",
  "NSRunLoop",
  "NSString",
  "NSValue",
] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = [
  "std",
  "CALayer",
  "CATransaction",
  "objc2-core-foundation",
] }

[dev-dependencies]
# The end-to-end test (tests/e2e.rs): the simulator's hands through the
# watcher into a store, the app's side of the channel, this process.
rail-watch = { path = "../../core/rail-watch" }
# The default layout is the simulator's table geometry (R3.4): a test holds
# `layout::seat_center` to `rail_hud_sim::draw::seat_center`.
rail-hud-sim = { path = "../rail-hud-sim" }

# (R3.12) The macOS overlay test makes AppKit windows in its own process,
# which AppKit allows on the main thread only: the test has its own `main`
# (libtest runs tests on other threads). Elsewhere it says it skipped.
[[test]]
name = "macos_overlay"
harness = false

# (R3.13) The macOS tracking test: the observers moving the overlays of the
# simulator's tables (AppKit again: its own `main`).
[[test]]
name = "macos_tracking"
harness = false

# (R3.14) Twelve tables: the HUD process over twelve simulator tables and a
# refused thirteenth, measured against the budget and reported. Its own
# `main` (it parses its own options, and without `--run` it only says how to
# run it, so the workspace's `cargo test` does not pay for it).
[[test]]
name = "twelve_tables"
harness = false
