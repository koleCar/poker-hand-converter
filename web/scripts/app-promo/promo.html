<!doctype html>
<!--
  The Rail desktop app's promo image (/download, the header's "Get the app").
  Rendered to web/public/download/rail-app-promo.<lang>.png by render.mjs;
  `?lang=hr` swaps the copy. 1200 x 630, the Open Graph size, so the same
  picture works as the page's share image.

  The window on the right is a drawing of the app, not a screenshot: the
  numbers are made up and no real player is shown.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rail app promo</title>
    <style>
      @font-face {
        font-family: "Inter";
        src: url("../../public/fonts/inter-v4.1-latin.woff2") format("woff2");
        font-weight: 400 800;
        unicode-range: U+0000-00FF, U+2000-206F, U+2212;
      }
      @font-face {
        font-family: "Inter";
        src: url("../../public/fonts/inter-v4.1-latin-ext.woff2") format("woff2");
        font-weight: 400 800;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF;
      }

      :root {
        --bg: #0b0f14;
        --raised: #121820;
        --raised-2: #18202b;
        --inset: #0f151d;
        --line: #24303e;
        --line-soft: #1b2430;
        --fg: #e8eef6;
        --fg-muted: #8da0b6;
        --fg-dim: #64748b;
        --accent: #3ea6ff;
        --accent-strong: #1f8fef;
        --felt-1: #1a6a4a;
        --felt-2: #0d4531;
        --felt-3: #072b1e;
        --rail-1: #5a3a24;
        --rail-2: #2a1810;
        --money: #f7d79a;
        /* docs/CHARTS.md colour standard: winnings green, EV yellow. */
        --win: #3fcf8e;
        --ev: #f2c94c;
        --bad: #ff6b6b;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        font-family: "Inter", system-ui, sans-serif;
        color: var(--fg);
        background:
          radial-gradient(900px 520px at 88% 30%, rgb(62 166 255 / 16%), transparent 60%),
          radial-gradient(700px 500px at 75% 110%, rgb(26 106 74 / 32%), transparent 65%),
          radial-gradient(600px 400px at 0% 0%, #14202c, transparent 70%),
          var(--bg);
        -webkit-font-smoothing: antialiased;
      }

      /* A faint grid, so the dark field is not flat. */
      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgb(255 255 255 / 2.5%) 1px, transparent 1px),
          linear-gradient(90deg, rgb(255 255 255 / 2.5%) 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: linear-gradient(90deg, #000 0%, transparent 55%);
      }

      /* ------------------------------------------------------------- copy */

      .copy {
        position: absolute;
        left: 64px;
        top: 58px;
        width: 500px;
      }

      .lockup {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--accent);
      }

      .lockup__name {
        position: relative;
        font-size: 34px;
        font-weight: 750;
        letter-spacing: -0.03em;
        color: var(--fg);
      }

      .lockup__i {
        position: relative;
        color: transparent;
      }

      .lockup__i::before {
        content: "i";
        position: absolute;
        inset: 0;
        color: var(--fg);
        clip-path: inset(30% 0 0 0);
      }

      .lockup__i::after {
        content: "";
        position: absolute;
        top: -0.02em;
        left: 50%;
        width: 0.34em;
        height: 0.34em;
        border-radius: 50%;
        background: var(--accent);
        transform: translateX(-50%);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 34px;
        padding: 6px 12px;
        border: 1px solid rgb(62 166 255 / 35%);
        border-radius: 999px;
        background: rgb(62 166 255 / 10%);
        color: #9ed4ff;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--win);
        box-shadow: 0 0 0 3px rgb(63 207 142 / 20%);
      }

      h1 {
        margin-top: 18px;
        font-size: 50px;
        line-height: 1.04;
        font-weight: 780;
        letter-spacing: -0.035em;
      }

      h1 em {
        font-style: normal;
        background: linear-gradient(90deg, #7abaff, var(--accent));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .lede {
        margin-top: 18px;
        font-size: 18px;
        line-height: 1.45;
        color: var(--fg-muted);
        max-width: 470px;
      }

      .features {
        margin-top: 22px;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 10px;
      }

      .features li {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 16px;
        font-weight: 550;
      }

      .features svg {
        flex: none;
      }

      .ctas {
        position: absolute;
        left: 64px;
        bottom: 52px;
        display: flex;
        gap: 12px;
      }

      .cta {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        height: 48px;
        padding: 0 20px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 650;
        border: 1px solid var(--line);
        background: var(--raised-2);
        color: var(--fg);
      }

      .cta--primary {
        border-color: transparent;
        background: linear-gradient(180deg, #4cb0ff, var(--accent-strong));
        color: #031220;
        box-shadow: 0 10px 30px rgb(31 143 239 / 35%);
      }

      /* ----------------------------------------------------------- window */

      .window {
        position: absolute;
        left: 612px;
        top: 64px;
        width: 560px;
        height: 500px;
        border-radius: 16px;
        border: 1px solid #2f3d4e;
        background: var(--raised);
        box-shadow:
          0 40px 80px rgb(0 0 0 / 55%),
          0 0 0 1px rgb(255 255 255 / 3%) inset;
        overflow: hidden;
        transform: perspective(1600px) rotateY(-9deg) rotateX(3deg);
        transform-origin: left center;
      }

      .titlebar {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        padding: 0 14px;
        border-bottom: 1px solid var(--line-soft);
        background: var(--raised-2);
      }

      .titlebar i {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #46566c;
      }

      .titlebar i:nth-child(1) {
        background: #ff5f57;
      }

      .titlebar i:nth-child(2) {
        background: #febc2e;
      }

      .titlebar i:nth-child(3) {
        background: #28c840;
      }

      .titlebar span {
        margin-left: auto;
        margin-right: auto;
        padding-right: 50px;
        font-size: 12px;
        font-weight: 600;
        color: var(--fg-muted);
      }

      .body {
        display: grid;
        grid-template-columns: 118px 1fr;
        height: calc(100% - 36px);
      }

      .side {
        padding: 12px 8px;
        border-right: 1px solid var(--line-soft);
        background: var(--inset);
        display: grid;
        align-content: start;
        gap: 3px;
      }

      .side b {
        display: block;
        padding: 7px 10px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 550;
        color: var(--fg-muted);
      }

      .side b.on {
        background: #24354a;
        color: var(--fg);
      }

      .side .sync {
        margin-top: 14px;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid var(--line-soft);
        font-size: 10.5px;
        line-height: 1.35;
        color: var(--fg-dim);
      }

      .side .sync strong {
        display: block;
        color: var(--win);
        font-weight: 650;
      }

      .main {
        position: relative;
        padding: 14px;
      }

      /* The table: wood rail, felt, board. */
      .table {
        position: relative;
        height: 252px;
      }

      .rail {
        position: absolute;
        left: 34px;
        right: 34px;
        top: 34px;
        bottom: 34px;
        border-radius: 999px;
        background: linear-gradient(180deg, var(--rail-1), var(--rail-2));
        box-shadow: 0 14px 30px rgb(0 0 0 / 45%);
      }

      .felt {
        position: absolute;
        inset: 10px;
        border-radius: 999px;
        background: radial-gradient(ellipse at 50% 40%, var(--felt-1), var(--felt-2) 70%, var(--felt-3));
        box-shadow: inset 0 0 24px rgb(0 0 0 / 45%);
      }

      .board {
        position: absolute;
        left: 50%;
        top: 50%;
        display: flex;
        gap: 5px;
        transform: translate(-50%, -62%);
      }

      .card {
        width: 30px;
        height: 42px;
        border-radius: 5px;
        background: #f7f9fc;
        box-shadow: 0 2px 6px rgb(0 0 0 / 35%);
        padding: 3px 0 0 5px;
        font-size: 15px;
        font-weight: 750;
        line-height: 1;
        color: #18202b;
      }

      .card small {
        display: block;
        font-size: 14px;
        margin-top: 2px;
      }

      .card.red {
        color: #d63a3a;
      }

      .pot {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, 24px);
        padding: 3px 10px;
        border-radius: 999px;
        background: rgb(0 0 0 / 35%);
        font-size: 11px;
        font-weight: 650;
        color: var(--money);
        white-space: nowrap;
      }

      .seat {
        position: absolute;
        width: 92px;
        border-radius: 9px;
        border: 1px solid #2f3d4e;
        background: rgb(18 24 32 / 94%);
        padding: 5px 7px 6px;
        box-shadow: 0 6px 16px rgb(0 0 0 / 40%);
      }

      .seat__name {
        display: flex;
        justify-content: space-between;
        font-size: 9.5px;
        font-weight: 650;
        color: var(--fg-muted);
      }

      .seat__name em {
        font-style: normal;
        color: var(--fg-dim);
        font-weight: 550;
      }

      .seat__stats {
        display: flex;
        gap: 6px;
        margin-top: 3px;
        font-size: 14px;
        font-weight: 750;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.01em;
      }

      .seat--hero {
        border-color: rgb(62 166 255 / 60%);
        box-shadow:
          0 0 0 3px rgb(62 166 255 / 15%),
          0 6px 16px rgb(0 0 0 / 40%);
      }

      .v {
        color: #7abaff;
      }

      .p {
        color: var(--win);
      }

      .t {
        color: var(--ev);
      }

      .x {
        color: var(--bad);
      }

      /* Graph and numbers under the table. */
      .row {
        display: grid;
        grid-template-columns: 1fr 112px;
        gap: 10px;
        margin-top: 8px;
      }

      .panel {
        border: 1px solid var(--line-soft);
        border-radius: 10px;
        background: var(--inset);
        padding: 9px 11px;
      }

      .panel h3 {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 11px;
        font-weight: 650;
        color: var(--fg-muted);
      }

      .legend {
        display: flex;
        gap: 9px;
        font-size: 9.5px;
        font-weight: 550;
        color: var(--fg-dim);
      }

      .legend span::before {
        content: "";
        display: inline-block;
        width: 10px;
        height: 2px;
        margin-right: 4px;
        vertical-align: middle;
        background: var(--c);
      }

      .kpis {
        display: grid;
        gap: 8px;
      }

      .kpi {
        border: 1px solid var(--line-soft);
        border-radius: 10px;
        background: var(--inset);
        padding: 8px 10px;
      }

      .kpi small {
        display: block;
        font-size: 9.5px;
        font-weight: 600;
        color: var(--fg-dim);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .kpi b {
        display: block;
        margin-top: 2px;
        font-size: 18px;
        font-weight: 750;
        font-variant-numeric: tabular-nums;
      }

      /* The import toast, floating over the window's corner. */
      .toast {
        position: absolute;
        left: 560px;
        top: 470px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-radius: 12px;
        border: 1px solid #2f3d4e;
        background: rgb(24 32 43 / 96%);
        box-shadow: 0 18px 40px rgb(0 0 0 / 55%);
        font-size: 13px;
        font-weight: 600;
      }

      .toast i {
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: rgb(63 207 142 / 16%);
        color: var(--win);
        font-style: normal;
        font-weight: 800;
      }

      .toast small {
        display: block;
        font-size: 11px;
        font-weight: 500;
        color: var(--fg-muted);
      }
    </style>
  </head>
  <body>
    <section class="copy">
      <div class="lockup">
        <svg viewBox="0 0 32 32" width="40" height="40" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true">
          <ellipse cx="16" cy="16" rx="13.5" ry="8" />
          <rect x="11.5" y="14.5" width="9" height="3" rx="1.5" fill="currentColor" stroke="none" />
        </svg>
        <span class="lockup__name">ra<span class="lockup__i">i</span>l</span>
      </div>

      <div class="eyebrow" data-t="eyebrow"></div>
      <h1 data-t="headline"></h1>
      <p class="lede" data-t="lede"></p>

      <ul class="features">
        <li><svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="10" fill="rgb(63 207 142 / 16%)" /><path d="M6 10.4l2.6 2.6L14 7.6" stroke="#3fcf8e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg><span data-t="f1"></span></li>
        <li><svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="10" fill="rgb(63 207 142 / 16%)" /><path d="M6 10.4l2.6 2.6L14 7.6" stroke="#3fcf8e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg><span data-t="f2"></span></li>
        <li><svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="10" fill="rgb(63 207 142 / 16%)" /><path d="M6 10.4l2.6 2.6L14 7.6" stroke="#3fcf8e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg><span data-t="f3"></span></li>
      </ul>
    </section>

    <div class="ctas">
      <span class="cta cta--primary">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v10M5.5 8.8L10 13.3l4.5-4.5M4 17h12" /></svg>
        <span data-t="mac"></span>
      </span>
      <span class="cta">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v10M5.5 8.8L10 13.3l4.5-4.5M4 17h12" /></svg>
        <span data-t="win"></span>
      </span>
    </div>

    <div class="window">
      <div class="titlebar"><i></i><i></i><i></i><span>Rail</span></div>
      <div class="body">
        <nav class="side">
          <b data-t="navToday"></b>
          <b data-t="navHands"></b>
          <b data-t="navReports"></b>
          <b data-t="navPlayers"></b>
          <b class="on">HUD</b>
          <b data-t="navAnalysis"></b>
          <div class="sync"><strong data-t="synced"></strong><span data-t="syncedSub"></span></div>
        </nav>

        <div class="main">
          <div class="table">
            <div class="rail"><div class="felt"></div></div>
            <div class="board">
              <div class="card">A<small>♠</small></div>
              <div class="card red">K<small>♥</small></div>
              <div class="card">7<small>♣</small></div>
              <div class="card red">Q<small>♦</small></div>
            </div>
            <div class="pot" data-t="pot"></div>

            <div class="seat" style="left: 168px; top: 0"><div class="seat__name">reg_ace <em>1.4k</em></div><div class="seat__stats"><span class="v">23</span><span class="p">19</span><span class="t">8</span></div></div>
            <div class="seat" style="right: 0; top: 46px"><div class="seat__name">fishhook <em>212</em></div><div class="seat__stats"><span class="v">54</span><span class="p">6</span><span class="x">2</span></div></div>
            <div class="seat" style="right: 0; bottom: 40px"><div class="seat__name">riverrat <em>860</em></div><div class="seat__stats"><span class="v">31</span><span class="p">24</span><span class="t">11</span></div></div>
            <div class="seat seat--hero" style="left: 168px; bottom: 0"><div class="seat__name">Hero <em>2.2k</em></div><div class="seat__stats"><span class="v">25</span><span class="p">21</span><span class="t">9</span></div></div>
            <div class="seat" style="left: 0; bottom: 40px"><div class="seat__name">nitpicker <em>3.1k</em></div><div class="seat__stats"><span class="v">14</span><span class="p">12</span><span class="t">5</span></div></div>
            <div class="seat" style="left: 0; top: 46px"><div class="seat__name">lagmaster <em>540</em></div><div class="seat__stats"><span class="v">38</span><span class="p">33</span><span class="t">14</span></div></div>
          </div>

          <div class="row">
            <div class="panel">
              <h3><span data-t="graph"></span><span class="legend"><span style="--c: var(--win)" data-t="won"></span><span style="--c: var(--ev)">EV</span></span></h3>
              <svg viewBox="0 0 280 92" width="100%" height="92" preserveAspectRatio="none" aria-hidden="true">
                <defs>
                  <linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
                    <stop offset="0" stop-color="#3fcf8e" stop-opacity="0.28" />
                    <stop offset="1" stop-color="#3fcf8e" stop-opacity="0" />
                  </linearGradient>
                </defs>
                <path d="M0 70 H280" stroke="#24303e" stroke-dasharray="3 4" />
                <path d="M0 74 L20 70 L38 72 L56 63 L74 66 L92 55 L112 58 L130 47 L150 51 L168 40 L188 36 L206 41 L226 27 L246 24 L264 18 L280 12 V92 H0 Z" fill="url(#g)" />
                <path d="M0 74 L20 70 L38 72 L56 63 L74 66 L92 55 L112 58 L130 47 L150 51 L168 40 L188 36 L206 41 L226 27 L246 24 L264 18 L280 12" stroke="#3fcf8e" stroke-width="2.2" fill="none" stroke-linejoin="round" />
                <path d="M0 74 L24 69 L46 66 L70 61 L94 57 L118 52 L142 49 L166 44 L190 40 L214 35 L238 30 L262 26 L280 22" stroke="#f2c94c" stroke-width="1.8" fill="none" stroke-dasharray="5 3" />
              </svg>
            </div>
            <div class="kpis">
              <div class="kpi"><small data-t="hands"></small><b>2,231</b></div>
              <div class="kpi"><small>bb/100</small><b class="p">+6.4</b></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="toast"><i>+</i><div><span data-t="toast"></span><small data-t="toastSub"></small></div></div>

    <script>
      const COPY = {
        en: {
          eyebrow: "Desktop app · macOS & Windows",
          headline: "Your tracker and HUD,<br /><em>at the table.</em>",
          lede: "Rail imports every hand as you play, puts live stats on the table and syncs with your account.",
          f1: "Automatic import from your poker room",
          f2: "Live HUD over every table",
          f3: "Replayer, reports and leak analysis",
          mac: "Download for macOS",
          win: "Download for Windows",
          navToday: "Today",
          navHands: "Hands",
          navReports: "Reports",
          navPlayers: "Players",
          navAnalysis: "Analysis",
          synced: "Synced",
          syncedSub: "with rail account",
          pot: "Pot 24.50",
          graph: "Winnings",
          won: "Won",
          hands: "Hands",
          toast: "18 new hands imported",
          toastSub: "PokerStars · just now",
        },
        hr: {
          eyebrow: "Desktop aplikacija · macOS i Windows",
          headline: "Tvoj tracker i HUD,<br /><em>za stolom.</em>",
          lede: "Rail uvozi svaku ruku dok igraš, prikazuje statistiku uživo na stolu i sinkronizira se s tvojim računom.",
          f1: "Automatski uvoz iz tvoje poker sobe",
          f2: "HUD uživo na svakom stolu",
          f3: "Replayer, izvještaji i analiza propusta",
          mac: "Preuzmi za macOS",
          win: "Preuzmi za Windows",
          navToday: "Danas",
          navHands: "Ruke",
          navReports: "Izvještaji",
          navPlayers: "Igrači",
          navAnalysis: "Analiza",
          synced: "Sinkronizirano",
          syncedSub: "s rail računom",
          pot: "Pot 24,50",
          graph: "Rezultati",
          won: "Dobitak",
          hands: "Ruke",
          toast: "Uvezeno 18 novih ruku",
          toastSub: "PokerStars · upravo",
        },
      };
      const lang = new URLSearchParams(location.search).get("lang") === "hr" ? "hr" : "en";
      document.documentElement.lang = lang;
      for (const el of document.querySelectorAll("[data-t]")) {
        el.innerHTML = COPY[lang][el.dataset.t];
      }
    </script>
  </body>
</html>
