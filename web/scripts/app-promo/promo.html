<!doctype html>
<!--
  The Rail desktop app's pictures for /download, drawn by render.mjs:

  - `?view=page`  the picture on the page itself: the app and its tools, no
                  copy and no buttons (the page has its own heading and the
                  real download buttons right above it).
  - `?view=card`  the share card (Open Graph / Twitter): the same app with
                  the pitch beside it, for a link pasted into a chat.

  `?lang=hr` swaps the copy. Both are 1200 x 630, rendered at 2x.

  Everything here is a drawing of the app, not a screenshot: the numbers and
  the player names are made up and no real player is shown.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rail app promo</title>
    <style>
      @font-face {
        font-family: "Inter";
        src: url("../../public/fonts/inter-v4.1-latin.woff2") format("woff2");
        font-weight: 400 800;
        unicode-range: U+0000-00FF, U+2000-206F, U+2212;
      }
      @font-face {
        font-family: "Inter";
        src: url("../../public/fonts/inter-v4.1-latin-ext.woff2") format("woff2");
        font-weight: 400 800;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF;
      }

      :root {
        --bg: #0b0f14;
        --raised: #121820;
        --raised-2: #18202b;
        --inset: #0f151d;
        --line: #24303e;
        --line-soft: #1b2430;
        --edge: #2f3d4e;
        --fg: #e8eef6;
        --fg-muted: #8da0b6;
        --fg-dim: #64748b;
        --accent: #3ea6ff;
        --accent-strong: #1f8fef;
        --felt-1: #1a6a4a;
        --felt-2: #0d4531;
        --felt-3: #072b1e;
        --rail-1: #5a3a24;
        --rail-2: #2a1810;
        /* docs/CHARTS.md colour standard: winnings green, EV yellow. */
        --win: #3fcf8e;
        --ev: #f2c94c;
        --bad: #ff6b6b;
        /* Solver actions, as the app's strategy view colours them. */
        --a-check: #4fae6b;
        --a-small: #e5795a;
        --a-big: #b5383d;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        font-family: "Inter", system-ui, sans-serif;
        color: var(--fg);
        background:
          radial-gradient(820px 520px at 30% 20%, rgb(62 166 255 / 14%), transparent 62%),
          radial-gradient(760px 520px at 92% 100%, rgb(26 106 74 / 30%), transparent 65%),
          radial-gradient(520px 380px at 100% 0%, rgb(181 56 61 / 12%), transparent 70%),
          var(--bg);
        -webkit-font-smoothing: antialiased;
        font-variant-numeric: tabular-nums;
      }

      /* A faint grid, so the dark field is not flat. */
      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgb(255 255 255 / 2.4%) 1px, transparent 1px),
          linear-gradient(90deg, rgb(255 255 255 / 2.4%) 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: radial-gradient(900px 600px at 50% 50%, #000, transparent 80%);
      }

      .scene {
        position: absolute;
        inset: 0;
        transform-origin: 0 0;
      }

      /* ------------------------------------------------------- app window */

      .window {
        position: absolute;
        left: 36px;
        top: 40px;
        width: 812px;
        height: 550px;
        border-radius: 16px;
        border: 1px solid var(--edge);
        background: var(--raised);
        box-shadow:
          0 40px 90px rgb(0 0 0 / 60%),
          0 0 0 1px rgb(255 255 255 / 3%) inset;
        overflow: hidden;
      }

      .titlebar {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 34px;
        padding: 0 14px;
        border-bottom: 1px solid var(--line-soft);
        background: var(--raised-2);
      }

      .titlebar i {
        width: 11px;
        height: 11px;
        border-radius: 50%;
      }

      .titlebar i:nth-child(1) {
        background: #ff5f57;
      }

      .titlebar i:nth-child(2) {
        background: #febc2e;
      }

      .titlebar i:nth-child(3) {
        background: #28c840;
      }

      .titlebar span {
        margin: 0 auto;
        padding-right: 50px;
        font-size: 12px;
        font-weight: 600;
        color: var(--fg-muted);
      }

      .body {
        display: grid;
        grid-template-columns: 124px 1fr;
        height: calc(100% - 34px);
      }

      .side {
        padding: 12px 8px;
        border-right: 1px solid var(--line-soft);
        background: var(--inset);
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .side .brand {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 2px 8px 12px;
        color: var(--accent);
        font-size: 16px;
        font-weight: 750;
        letter-spacing: -0.02em;
      }

      .side .brand span {
        color: var(--fg);
      }

      .side b {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 9px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 550;
        color: var(--fg-muted);
      }

      .side b::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 2px;
        background: currentColor;
        opacity: 0.45;
      }

      .side b.on {
        background: #24354a;
        color: var(--fg);
      }

      .side b.on::before {
        background: var(--accent);
        opacity: 1;
      }

      .side .sync {
        margin-top: auto;
        padding: 8px 9px;
        border-radius: 8px;
        border: 1px solid var(--line-soft);
        font-size: 10px;
        line-height: 1.35;
        color: var(--fg-dim);
      }

      .side .sync strong {
        display: block;
        color: var(--win);
        font-weight: 650;
      }

      .main {
        display: grid;
        grid-template-rows: auto auto 1fr;
        gap: 10px;
        padding: 12px 14px 14px;
        min-width: 0;
      }

      /* Top row: Library | My nodelocks, and the spot. */
      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        font-weight: 600;
      }

      .switch {
        display: inline-flex;
        padding: 2px;
        border-radius: 8px;
        background: var(--inset);
        border: 1px solid var(--line-soft);
      }

      .switch span {
        padding: 4px 10px;
        border-radius: 6px;
        color: var(--fg-muted);
      }

      .switch span.on {
        background: #24354a;
        color: var(--fg);
      }

      .chip {
        padding: 4px 9px;
        border-radius: 999px;
        border: 1px solid var(--line-soft);
        background: var(--raised-2);
        color: var(--fg-muted);
      }

      .toolbar .grow {
        flex: 1;
      }

      .solving {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: var(--fg-muted);
      }

      .solving .bar {
        width: 70px;
        height: 5px;
        border-radius: 99px;
        background: var(--line);
        overflow: hidden;
      }

      .solving .bar::after {
        content: "";
        display: block;
        width: 72%;
        height: 100%;
        background: var(--accent);
      }

      /* The line: who did what, street by street. */
      .line {
        display: flex;
        gap: 5px;
        align-items: stretch;
      }

      .node {
        display: grid;
        gap: 1px;
        padding: 5px 8px;
        border-radius: 8px;
        border: 1px solid var(--line-soft);
        background: var(--inset);
        font-size: 10px;
        font-weight: 600;
        color: var(--fg-dim);
        white-space: nowrap;
      }

      .node b {
        font-size: 11.5px;
        font-weight: 650;
        color: var(--fg);
      }

      .node.street {
        background: var(--raised-2);
      }

      .node.street b {
        display: flex;
        gap: 3px;
      }

      .node.locked {
        border-color: rgb(242 201 76 / 55%);
        box-shadow: 0 0 0 3px rgb(242 201 76 / 10%);
      }

      .node.locked b {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .node.now {
        border-color: rgb(62 166 255 / 60%);
        background: rgb(62 166 255 / 10%);
      }

      .mini {
        display: inline-grid;
        place-items: center;
        width: 15px;
        height: 19px;
        border-radius: 3px;
        background: #f7f9fc;
        color: #18202b;
        font-size: 9.5px;
        font-weight: 750;
        line-height: 1;
      }

      .mini.red {
        color: #d63a3a;
      }

      /* Strategy: the 13 x 13 grid and the actions beside it. */
      .strategy {
        display: grid;
        grid-template-columns: 380px 1fr;
        gap: 12px;
        min-height: 0;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(13, 1fr);
        gap: 2px;
        align-self: start;
      }

      .cell {
        position: relative;
        height: 27px;
        border-radius: 3px;
        overflow: hidden;
        background: #141b24;
        display: flex;
      }

      .cell i {
        display: block;
        height: 100%;
      }

      .cell span {
        position: absolute;
        left: 2px;
        top: 1px;
        font-size: 8px;
        font-weight: 700;
        color: rgb(255 255 255 / 88%);
        text-shadow: 0 1px 1px rgb(0 0 0 / 45%);
        letter-spacing: -0.02em;
      }

      .cell.out span {
        color: #3a4757;
        text-shadow: none;
      }

      .cell.pick {
        outline: 2px solid #fff;
        outline-offset: -1px;
        z-index: 1;
      }

      .actions {
        display: grid;
        align-content: start;
        gap: 8px;
      }

      .panel {
        border: 1px solid var(--line-soft);
        border-radius: 10px;
        background: var(--inset);
        padding: 10px 11px;
      }

      .panel h3 {
        display: flex;
        justify-content: space-between;
        font-size: 10.5px;
        font-weight: 650;
        color: var(--fg-dim);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .act {
        display: grid;
        grid-template-columns: 10px 1fr auto auto;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        font-size: 12px;
        font-weight: 600;
      }

      .act i {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        background: var(--c);
      }

      .act em {
        font-style: normal;
        color: var(--fg-muted);
      }

      .act small {
        min-width: 44px;
        text-align: right;
        font-size: 11px;
        color: var(--ev);
      }

      .stack {
        display: flex;
        height: 7px;
        margin-top: 10px;
        border-radius: 99px;
        overflow: hidden;
      }

      .stack i {
        display: block;
        height: 100%;
      }

      .combos {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 5px;
        margin-top: 8px;
      }

      .combo {
        border-radius: 6px;
        overflow: hidden;
        border: 1px solid var(--line-soft);
        background: var(--raised-2);
      }

      .combo b {
        display: flex;
        justify-content: center;
        gap: 2px;
        padding: 4px 0 3px;
      }

      .combo .mini {
        width: 17px;
        height: 18px;
        font-size: 8.5px;
        letter-spacing: -0.04em;
      }

      .combo div {
        display: flex;
        height: 5px;
      }

      .combo div i {
        display: block;
        height: 100%;
      }

      .lockcard {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 11px;
        line-height: 1.35;
        color: var(--fg-muted);
      }

      .lockcard b {
        display: block;
        color: var(--fg);
        font-weight: 650;
      }

      .lockcard svg {
        flex: none;
        color: var(--ev);
      }

      /* ------------------------------------------------ floating tools */

      .float {
        position: absolute;
        border-radius: 14px;
        border: 1px solid var(--edge);
        background: rgb(20 27 36 / 97%);
        box-shadow: 0 24px 56px rgb(0 0 0 / 58%);
        padding: 12px 13px;
      }

      .float > small {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 10px;
        font-weight: 650;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--fg-dim);
      }

      .float > small::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--dot, var(--accent));
      }

      /* Tiled tables with the HUD, and the RNG box in the corner. */
      .tiles {
        left: 872px;
        top: 40px;
        width: 296px;
      }

      .tiles .wall {
        position: relative;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        margin-top: 9px;
      }

      .tbl {
        position: relative;
        height: 82px;
        border-radius: 7px;
        background: #0a1016;
        border: 1px solid var(--line-soft);
        overflow: hidden;
      }

      .tbl.act-now {
        border-color: rgb(62 166 255 / 70%);
        box-shadow: 0 0 0 2px rgb(62 166 255 / 18%);
      }

      .tbl .felt {
        position: absolute;
        left: 16px;
        right: 16px;
        top: 18px;
        bottom: 18px;
        border-radius: 99px;
        background: radial-gradient(ellipse at 50% 40%, var(--felt-1), var(--felt-2) 70%, var(--felt-3));
        border: 3px solid var(--rail-1);
      }

      .hud {
        position: absolute;
        padding: 1px 4px;
        border-radius: 4px;
        background: rgb(10 14 20 / 92%);
        border: 1px solid #2a3646;
        font-size: 8px;
        font-weight: 750;
        display: flex;
        gap: 3px;
        line-height: 1.35;
      }

      .v {
        color: #7abaff;
      }

      .p {
        color: var(--win);
      }

      .t {
        color: var(--ev);
      }

      .x {
        color: var(--bad);
      }

      .rng {
        position: absolute;
        right: -10px;
        bottom: -12px;
        width: 58px;
        height: 58px;
        border-radius: 12px;
        border: 1px solid rgb(62 166 255 / 50%);
        background: linear-gradient(180deg, #1c2a3a, #121a24);
        box-shadow: 0 12px 26px rgb(0 0 0 / 55%);
        display: grid;
        place-items: center;
        align-content: center;
        gap: 0;
      }

      .rng b {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
      }

      .rng small {
        font-size: 8px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: var(--fg-dim);
      }

      /* Trainer: a graded spot. */
      .trainer {
        left: 872px;
        top: 268px;
        width: 296px;
        --dot: var(--win);
      }

      .verdict {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
      }

      .verdict i {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 10px;
        background: rgb(63 207 142 / 16%);
        color: var(--win);
        font-style: normal;
      }

      .verdict b {
        display: block;
        font-size: 15px;
        font-weight: 700;
      }

      .verdict span {
        font-size: 11.5px;
        color: var(--fg-muted);
      }

      .hand {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-left: auto;
      }

      .hand .mini {
        width: 22px;
        height: 30px;
        font-size: 13px;
        border-radius: 4px;
      }

      .trainer .bars {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin-top: 11px;
      }

      .trainer .bars span {
        padding: 6px 0;
        border-radius: 8px;
        border: 1px solid var(--line-soft);
        background: var(--inset);
        text-align: center;
        font-size: 11px;
        font-weight: 650;
        color: var(--fg-muted);
      }

      .trainer .bars span.on {
        border-color: var(--a-small);
        color: var(--fg);
        background: rgb(229 121 90 / 14%);
      }

      /* Analysis: leaks by EV lost. */
      .leaks {
        left: 872px;
        top: 402px;
        width: 296px;
        --dot: var(--bad);
      }

      .leak {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 5px 10px;
        margin-top: 12px;
        font-size: 11.5px;
        font-weight: 550;
      }

      .leak em {
        font-style: normal;
        font-weight: 700;
        color: var(--bad);
      }

      .leak i {
        grid-column: 1 / -1;
        height: 5px;
        border-radius: 99px;
        background: var(--line);
        overflow: hidden;
      }

      .leak i::after {
        content: "";
        display: block;
        width: var(--w);
        height: 100%;
        background: linear-gradient(90deg, #ff8a8a, var(--bad));
      }

      /* The import toast, over the window's corner. */
      .toast {
        position: absolute;
        left: 610px;
        top: 548px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 14px 9px 10px;
        border-radius: 12px;
        border: 1px solid var(--edge);
        background: rgb(24 32 43 / 97%);
        box-shadow: 0 18px 40px rgb(0 0 0 / 55%);
        font-size: 12.5px;
        font-weight: 600;
      }

      .toast i {
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: rgb(63 207 142 / 16%);
        color: var(--win);
        font-style: normal;
        font-weight: 800;
      }

      .toast small {
        display: block;
        font-size: 10.5px;
        font-weight: 500;
        color: var(--fg-muted);
      }

      /* ------------------------------------------------- share card copy */

      .copy {
        display: none;
        position: absolute;
        left: 60px;
        top: 56px;
        width: 450px;
      }

      .lockup {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--accent);
      }

      .lockup__name {
        font-size: 32px;
        font-weight: 750;
        letter-spacing: -0.03em;
        color: var(--fg);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 30px;
        padding: 6px 12px;
        border: 1px solid rgb(62 166 255 / 35%);
        border-radius: 999px;
        background: rgb(62 166 255 / 10%);
        color: #9ed4ff;
        font-size: 12.5px;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--win);
        box-shadow: 0 0 0 3px rgb(63 207 142 / 20%);
      }

      h1 {
        margin-top: 18px;
        font-size: 48px;
        line-height: 1.05;
        font-weight: 780;
        letter-spacing: -0.035em;
      }

      h1 em {
        font-style: normal;
        background: linear-gradient(90deg, #7abaff, var(--accent));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .features {
        margin-top: 26px;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 12px;
      }

      .features li {
        display: flex;
        align-items: center;
        gap: 11px;
        font-size: 17px;
        font-weight: 550;
      }

      .features svg {
        flex: none;
      }

      .platforms {
        position: absolute;
        left: 60px;
        bottom: 54px;
        display: none;
        gap: 10px;
        font-size: 14px;
        font-weight: 650;
        color: var(--fg-muted);
      }

      .platforms span {
        padding: 8px 14px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--raised-2);
      }

      .platforms span.pro {
        border-color: rgb(62 166 255 / 40%);
        color: #9ed4ff;
        background: rgb(62 166 255 / 10%);
      }

      /* Card view: the pitch on the left, the app cropped on the right. */
      body.card .copy {
        display: block;
      }

      body.card .platforms {
        display: flex;
      }

      body.card .scene {
        transform: translate(530px, 46px) scale(0.86);
      }

      body.card .tiles,
      body.card .leaks {
        display: none;
      }

      body.card .trainer {
        left: 470px;
        top: 470px;
      }

      body.card .toast {
        display: none;
      }

      body.card::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, var(--bg) 0, rgb(11 15 20 / 92%) 520px, transparent 640px);
        pointer-events: none;
      }

      body.card .copy,
      body.card .platforms {
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="window">
        <div class="titlebar"><i></i><i></i><i></i><span>Rail</span></div>
        <div class="body">
          <nav class="side">
            <div class="brand">
              <svg viewBox="0 0 32 32" width="20" height="20" fill="none" stroke="currentColor" stroke-width="3.2" aria-hidden="true">
                <ellipse cx="16" cy="16" rx="13.5" ry="8" />
                <rect x="11.5" y="14.5" width="9" height="3" rx="1.5" fill="currentColor" stroke="none" />
              </svg>
              <span>rail</span>
            </div>
            <b data-t="navLive"></b>
            <b data-t="navHands"></b>
            <b data-t="navReports"></b>
            <b data-t="navPlayers"></b>
            <b data-t="navAnalysis"></b>
            <b class="on">Solver</b>
            <b data-t="navTrainer"></b>
            <b>HUD</b>
            <b data-t="navTables"></b>
            <div class="sync"><strong data-t="synced"></strong><span data-t="syncedSub"></span></div>
          </nav>

    <script>
      const COPY = {
        en: {
          eyebrow: "Desktop app · macOS & Windows",
          headline: "Track, solve and train,<br /><em>at the table.</em>",
          f1: "Live HUD, tiled tables and an RNG",
          f2: "Solver library and your own nodelocks",
          f3: "Trainer on your own leaks",
          f4: "Every hand imported as you play",
          navLive: "Live",
          navHands: "Hands",
          navReports: "Reports",
          navPlayers: "Players",
          navAnalysis: "Analysis",
          navTrainer: "Trainer",
          navTables: "Tables",
          synced: "Synced",
          syncedSub: "with your Rail account",
          library: "Library",
          myLocks: "My nodelocks",
          solving: "Solving",
          call: "Call",
          check: "Check",
          bigBet: "Bet 75%",
          smallBet: "Bet 33%",
          lockTitle: "BB check locked",
          lockSub: "Overfolds to a c-bet",
          tilesLabel: "Tables · 4 tiled",
          trainerLabel: "Trainer · BTN vs BB",
          correct: "Correct",
          correctSub: "Bet 33% · best EV",
          leaksLabel: "Leaks · bb/100",
          leak1: "BB fold to c-bet",
          leak2: "SB 3-bet vs BTN",
          leak3: "River call vs overbet",
          toast: "18 new hands imported",
          toastSub: "PokerStars · just now",
        },
        hr: {
          eyebrow: "Desktop aplikacija · macOS i Windows",
          headline: "Prati, solvaj i treniraj,<br /><em>za stolom.</em>",
          f1: "HUD uživo, poslagani stolovi i RNG",
          f2: "Solver biblioteka i tvoji nodelockovi",
          f3: "Trener na tvojim propustima",
          f4: "Svaka ruka uvezena dok igraš",
          navLive: "Uživo",
          navHands: "Ruke",
          navReports: "Izvještaji",
          navPlayers: "Igrači",
          navAnalysis: "Analiza",
          navTrainer: "Trener",
          navTables: "Stolovi",
          synced: "Sinkronizirano",
          syncedSub: "s tvojim Rail računom",
          library: "Biblioteka",
          myLocks: "Moji nodelockovi",
          solving: "Solvanje",
          call: "Call",
          check: "Check",
          bigBet: "Bet 75%",
          smallBet: "Bet 33%",
          lockTitle: "BB check zaključan",
          lockSub: "Prečesto folda na c-bet",
          tilesLabel: "Stolovi · 4 poslagana",
          trainerLabel: "Trener · BTN vs BB",
          correct: "Točno",
          correctSub: "Bet 33% · najbolji EV",
          leaksLabel: "Propusti · bb/100",
          leak1: "BB fold na c-bet",
          leak2: "SB 3-bet vs BTN",
          leak3: "River call vs overbet",
          toast: "Uvezeno 18 novih ruku",
          toastSub: "PokerStars · upravo",
        },
      };
      const params = new URLSearchParams(location.search);
      const lang = params.get("lang") === "hr" ? "hr" : "en";
      document.documentElement.lang = lang;
      if (params.get("view") === "card") document.body.classList.add("card");
      for (const el of document.querySelectorAll("[data-t]")) {
        el.innerHTML = COPY[lang][el.dataset.t];
      }

      // The strategy grid: BTN's c-bet on K72 rainbow after BB checks. A drawing,
      // close enough to read like a solve: value and the best Ax bet, the rest
      // checks; hands BTN does not open are left empty.
      const R = "AKQJT98765432";
      const opens = (hi, lo, suited) => {
        if (hi === lo) return true;
        const a = R[hi], b = R[lo];
        if (suited) return a === "A" || a === "K" || (a === "Q" && lo <= 10) || (a === "J" && lo <= 8) || (a === "T" && lo <= 8) || (a === "9" && lo <= 9) || (a === "8" && lo <= 9) || (a === "7" && lo <= 9) || (a === "6" && lo <= 10) || (a === "5" && lo <= 10);
        return (a === "A") || (a === "K" && lo <= 6) || (a === "Q" && lo <= 5) || (a === "J" && lo <= 5) || (a === "T" && lo <= 6) || (a === "9" && b === "8");
      };
      // [bet 75%, bet 33%, check], summing to 1.
      const mix = (hi, lo, suited) => {
        const a = R[hi], b = R[lo];
        if (hi === lo) {
          if (a === "K" || a === "7" || a === "2") return [0.7, 0.2, 0.1];
          if (a === "A") return [0.55, 0.35, 0.1];
          if (hi < 5) return [0.15, 0.45, 0.4];
          return [0.05, 0.35, 0.6];
        }
        if (a === "K" || b === "K") return b === "A" || a === "A" ? [0.45, 0.45, 0.1] : lo <= 4 ? [0.35, 0.5, 0.15] : (b === "7" || b === "2") ? [0.6, 0.3, 0.1] : [0.15, 0.55, 0.3];
        if (b === "7" || b === "2") return (a === "A") ? [0.2, 0.6, 0.2] : [0.05, 0.45, 0.5];
        if (a === "A") return suited ? [0.1, 0.7, 0.2] : [0.05, 0.6, 0.35];
        if (suited && (lo - hi) <= 2 && hi >= 4) return [0.1, 0.4, 0.5];
        if (a === "Q" || a === "J") return [0.02, 0.38, 0.6];
        return [0.02, 0.18, 0.8];
      };
      const colours = ["var(--a-big)", "var(--a-small)", "var(--a-check)"];
      const grid = document.getElementById("grid");
      for (let i = 0; i < 13; i++) {
        for (let j = 0; j < 13; j++) {
          const hi = Math.min(i, j), lo = Math.max(i, j);
          const suited = j > i;
          const name = R[hi] + R[lo] + (hi === lo ? "" : suited ? "s" : "o");
          const cell = document.createElement("div");
          cell.className = "cell";
          if (opens(hi, lo, suited)) {
            for (const [k, f] of mix(hi, lo, suited).entries()) {
              const bar = document.createElement("i");
              bar.style.width = `${f * 100}%`;
              bar.style.background = colours[k];
              cell.append(bar);
            }
          } else {
            cell.classList.add("out");
          }
          if (name === "AQo") cell.classList.add("pick");
          const label = document.createElement("span");
          label.textContent = name;
          cell.append(label);
          grid.append(cell);
        }
      }

      // AQo's combos: each tile shows how that combo splits.
      const combos = document.getElementById("combos");
      const suits = [["♠", ""], ["♥", "red"], ["♦", "red"], ["♣", ""]];
      const splits = [[0.1, 0.55, 0.35], [0.05, 0.7, 0.25], [0.0, 0.6, 0.4], [0.15, 0.5, 0.35]];
      for (let n = 0; n < 4; n++) {
        const [s1, c1] = suits[n], [s2, c2] = suits[(n + 1) % 4];
        const tile = document.createElement("div");
        tile.className = "combo";
        tile.innerHTML = `<b><span class="mini ${c1}">A${s1}</span><span class="mini ${c2}">Q${s2}</span></b><div>${splits[n].map((f, k) => `<i style="width:${f * 100}%;background:${colours[k]}"></i>`).join("")}</div>`;
        combos.append(tile);
      }
    </script>
