<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The Rail mark: the rail, and the board on the felt. Same geometry as
    src/components/brand/RailMark.tsx at its small size — heavier stroke, board
    bar thickened — so neither part greys out at 16px.

    A favicon has no ancestor to inherit currentColor from, so the colours are
    declared here, and the rail is drawn in ink rather than the accent: against
    browser chrome a mid-blue ellipse at 16px has far less contrast than a
    near-black or near-white one. The board bar carries the accent.

    The media query inverts against the browser's own chrome. It is honoured for
    favicons in Firefox and Safari and ignored harmlessly elsewhere.
  -->
  <style>
    :root { --ink: #e8eef6; --board: #3ea6ff; }
    @media (prefers-color-scheme: light) {
      :root { --ink: #16202b; --board: #1f8fef; }
    }
  </style>
  <ellipse cx="16" cy="16" rx="13" ry="7.5" fill="none" stroke="var(--ink)" stroke-width="3.5" />
  <rect x="11.5" y="14.25" width="9" height="3.5" rx="1.75" fill="var(--board)" />
</svg>
